<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanyu HTML Deck</title>
<!-- ============================================================
     本地演示台 / Hanyu HTML Deck — 面向 AI 生成 HTML 演示文稿的本地优先框架。
     复制整个 hanyu-html-deck/ 目录到项目文件夹，将本文件改名为 index.html，
     修改文件尾 DECK 配置，再替换示例页。
     ============================================================ -->
<style>
  /* 本地字体(同目录 fonts/,全量字符):全平台渲染一致；发送版由 build_send.py 内联。
     可变字重用一条声明覆盖 100–900：写成两条会让发送版把同一份字体内联两遍。 */
  @font-face { font-family: "Noto Sans SC"; font-weight: 100 900; src: url("fonts/NotoSansSC.woff2") format("woff2"); }
  :root { --paper: #f2f1ed; --hair: #d2d0c8; --ink: #111; --chrome: #121212; --chair: #2c2c2c; --nh: 296px; --dw: 420px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans SC", -apple-system, "Helvetica Neue", sans-serif;
    background: var(--chrome);
    color: #d8d6d0;
    font-weight: 300;
    overflow: hidden;
  }
  body.present { background: #0c0c0c; }

  /* ===== 1:1 原尺寸模式(R):给 Figma 之类的 DOM 抓取插件用 =====
     常态下 fitSlide() 会给画布写内联 transform:scale(),插件读到的是缩放后的几何——
     画布尺寸不再是 1920×1080,子元素坐标也被小数缩放带偏。本模式摘掉缩放与边框,
     让插件抓到真实尺寸;画布超出窗口靠滚动查看,是预期行为。 */
  body.raw { overflow: auto; background: #1a1a1a; }
  body.raw #stage {
    position: static; display: block; overflow: visible;
    width: 1920px; height: 1080px;
  }
  body.raw .canvas { transform: none !important; border: none; box-shadow: none; }
  body.raw .slide .canvas, body.raw .slide .canvas * { animation: none !important; }
  body.raw #notesPanel, body.raw #progress, body.raw .navzone { display: none; }

  /* ===== 工具钮 =====
     半透明深底+背景模糊:叠在浅色画布上也读得清 */
  #toolbar {
    position: fixed; top: 10px; right: 10px; z-index: 90; /* 高于总览(80):总览下仍可切回默认 */
    display: flex; flex-direction: row; align-items: center; gap: 12px;
    color: #d8d6d0; font-size: 13px;
    transition: opacity .25s;
  }
  /* 图标钮统一规格:纯图标、无文字标签；解释浮层悬停 0.2 秒后出现。 */
  #toolbar button {
    font: inherit; color: #b5b3ac; background: rgba(14,14,14,.58);
    border: none; border-radius: 3px; padding: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #toolbar button svg { display: block; width: 15px; height: 15px; }
  #toolbar button:hover { background: var(--paper); color: var(--ink); }
  /* 解释浮层:单独一层挂在 body 上,位置由 JS 按目标元素算。
     不用 ::after——批注面板 overflow:hidden 会把探出面板的提示裁掉。
     .tip-up 仅作标记:该元素优先向上弹出。 */
  #tip {
    position: fixed; left: 0; top: 0; z-index: 200; pointer-events: none;
    padding: 7px 9px; background: #303030; color: #f0eee8;
    border: 1px solid #444; border-radius: 3px; white-space: nowrap;
    font-size: 11px; font-weight: 300; letter-spacing: .04em;
    opacity: 0; visibility: hidden; transform: translateY(-3px);
    transition: opacity .12s ease, transform .12s ease, visibility 0s linear .12s;
  }
  #tip.on {
    opacity: 1; visibility: visible; transform: translateY(0);
    transition: opacity .12s ease, transform .12s ease;
  }

  /* 批注区拉起/收起把手:贴在批注面板顶边中央的半圆钮(面板 overflow:hidden 会裁子元素,故用 fixed) */
  #notesToggle {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--nh) + 3px); z-index: 41;
    width: 48px; height: 19px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: var(--chrome); border: 1px solid var(--chair); border-bottom: none;
    border-radius: 22px 22px 0 0; color: #b5b3ac;
    transition: color .18s, bottom .32s cubic-bezier(.22,.61,.21,1);
    font: inherit;
  }
  #notesToggle:hover { color: var(--paper); }
  #notesToggle svg { width: 16px; height: 16px; display: block; transition: transform .28s; }
  body:not(.notes-mini) #notesToggle svg { transform: rotate(180deg); } /* 展开态箭头朝下=收起 */
  body.notes-mini #notesToggle { bottom: 46px; }
  body.present #notesToggle, body.raw #notesToggle, body.notes-hidden #notesToggle { display: none; }
  /* 视图三段(演示/默认/总览):互斥单选,淡底托盘+细边读作一组;
     选中不靠各自变底色,而是一个方块(.thumb)在三个位置之间滑动 */
  #segView {
    position: relative;
    display: flex; gap: 2px; padding: 3px; border-radius: 5px;
    background: rgba(14,14,14,.62); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #segView .thumb {
    position: absolute; top: 0; left: 0; z-index: 0;
    background: rgba(255,255,255,.16); border-radius: 3px;
    transition: transform .24s cubic-bezier(.22,.61,.21,1), width .24s, height .24s;
    pointer-events: none;
  }
  #segView .thumb.noanim { transition: none; }
  #segView button {
    position: relative; z-index: 1;
    background: none; border-radius: 3px; color: #9d9b94;
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  #segView button:hover { background: none; color: #d8d6d0; }
  #segView button.on { background: none; color: #f0eee8; } /* 亮的是图标,底色交给滑块 */
  /* 导出:带向下小三角,表示点开是菜单而非直接触发 */
  #exWrap { position: relative; display: flex; }
  #exWrap > button { gap: 4px; padding-right: 7px; }
  #exWrap .caret {
    width: 0; height: 0; opacity: .7;
    border-left: 3.5px solid transparent; border-right: 3.5px solid transparent;
    border-top: 4px solid currentColor;
    transition: transform .18s;
  }
  #exWrap.open .caret { transform: rotate(180deg); }
  #exMenu {
    position: absolute; top: calc(100% + 6px); right: 0; display: none;
    flex-direction: column; min-width: 150px; padding: 5px 0;
    background: var(--chrome); border: 1px solid var(--chair);
    font-size: 12px; font-weight: 300; letter-spacing: .12em;
  }
  #exMenu.open { display: flex; }
  #exMenu button { text-align: left; justify-content: flex-start; padding: 8px 16px; white-space: nowrap; background: none; border-radius: 0; backdrop-filter: none; -webkit-backdrop-filter: none; }
  /* 可切换项:未选中不占位,选中时让出空间给对勾 */
  #exMenu button.toggle::before {
    content: ""; width: 0; height: 5px; margin-right: 0;
    border-left: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg) translate(1px, -2px); opacity: 0;
    transition: width .16s ease, margin-right .16s ease, opacity .16s ease;
  }
  #exMenu button.toggle.on::before { width: 9px; margin-right: 9px; opacity: 1; }
  body.present #toolbar { opacity: 0; pointer-events: none; }
  body.present #toolbar:hover,
  body.present.reveal-ui #toolbar { opacity: 1; pointer-events: auto; }

  /* ===== 舞台与页面 ===== */
  #stage {
    /* 顶部无横条,画布向上撑满(fitSlide 的 0.97 缩放自带呼吸边) */
    position: absolute; top: 0; bottom: calc(var(--nh) + 4px); left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    /* 画布布局盒固定 1920,scale 只缩视觉不缩布局——不裁剪的话窄屏(竖屏/4:3)会长出横向滚动条 */
    overflow: hidden;
  }
  body.present #stage { top: 0; bottom: 0; }
  body.notes-hidden:not(.present) #stage { bottom: 16px; }

  .slide { display: none; }
  .slide.current { display: block; }
  .slide aside { display: none; } /* 讲稿/内部注记模板,由底部批注面板读取展示 */
  .canvas {
    width: 1920px; height: 1080px;
    background: var(--paper); color: var(--ink); position: relative; overflow: hidden;
    transform-origin: center center;
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: 10px 10px 0 rgba(0,0,0,.32);
  }
  body.present .canvas { border-color: transparent; box-shadow: 12px 12px 0 rgba(0,0,0,.45); }
  .canvas.dark { background: #000; }
  .canvas.full-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .canvas b, .canvas strong { font-weight: 600; }

  /* 页脚线(代码页统一,JS 注入;满幅图页与带 nofoot 类的画布不注入) */
  .pfoot {
    position: absolute; left: 100px; right: 100px; bottom: 34px;
    border-top: 1px solid #c9c6bc; padding-top: 12px;
    display: flex; justify-content: space-between; align-items: flex-start;
    font-size: 24px; font-weight: 600; letter-spacing: .14em; color: #777;
  }
  .pfoot .pn { background: var(--ink); color: #fff; padding: 7px 10px 7px 16px; margin-top: -12px; }
  .canvas.dark .pfoot { border-color: #333; color: #777; }
  .canvas.dark .pfoot .pn { background: #fff; color: #000; }

  /* ===== 翻页点击区(画布带 nav-narrow 类的页收窄到 4%,给悬停交互让位) ===== */
  .navzone { position: absolute; top: 0; bottom: calc(var(--nh) + 4px); width: 12%; z-index: 20; cursor: pointer; }
  body.present .navzone { top: 0; bottom: 0; }
  #zonePrev { left: 0; } #zoneNext { right: 0; }
  body.navnarrow .navzone { width: 4%; }
  /* 悬停反馈:极淡底色 + 线性箭头。两者都用中灰——浅色纸底上偏暗、纯黑画布上偏亮,
     不必按页面明暗分别写一套 */
  .navzone::before, .navzone::after {
    content: ""; position: absolute; opacity: 0;
    transition: opacity .2s ease; pointer-events: none;
  }
  .navzone::before { inset: 0; }
  #zonePrev::before { background: linear-gradient(90deg, rgba(150,150,150,.16), transparent 62%); }
  #zoneNext::before { background: linear-gradient(270deg, rgba(150,150,150,.16), transparent 62%); }
  .navzone::after {
    top: 50%; width: 15px; height: 15px; margin-top: -8px;
    border-left: 1.5px solid rgba(150,150,150,.85);
    border-bottom: 1.5px solid rgba(150,150,150,.85);
  }
  #zonePrev::after { left: 30px; transform: rotate(45deg); }
  #zoneNext::after { right: 30px; transform: rotate(-135deg); }
  .navzone:hover::before, .navzone:hover::after { opacity: 1; }
  /* 演示态不显示:工具条都隐掉了,这层提示会亮在投影上被观众看到 */
  body.present .navzone::before, body.present .navzone::after { display: none; }

  /* ===== 进度条 ===== */
  #progress { position: fixed; bottom: 0; left: 0; right: 0; height: 3px; background: #262626; z-index: 60; }
  #progressBar { height: 100%; width: 0; background: #e8e6df; transition: width .2s; }

  /* ===== 讲稿面板 + 右侧备注抽屉 ===== */
  #notesPanel {
    position: fixed; bottom: 3px; left: 0; right: 0; height: var(--nh); z-index: 40;
    background: var(--chrome); border-top: 1px solid var(--chair);
    display: flex; flex-direction: column; gap: 0; overflow: hidden;
  }
  #nGrip { position: absolute; left: 0; right: 0; top: 0; height: 7px; cursor: ns-resize; z-index: 6; }
  /* 迷你态(默认):正文收起只留表头一条;展开/收起走 .notes-anim 的高度过渡(常态不挂 transition,免得拖动调高被拖慢) */
  body.notes-mini #notesPanel { height: 43px; }
  body.notes-mini #nGrip { display: none; }
  #notesPanel .col { transition: opacity .25s ease; }
  body.notes-mini #notesPanel .col { opacity: 0; }
  body.notes-mini:not(.present) #stage, body.notes-mini:not(.present) .navzone { bottom: 50px; }
  body.notes-anim #notesPanel { transition: height .32s cubic-bezier(.22,.61,.21,1); }
  body.notes-anim #stage, body.notes-anim .navzone { transition: bottom .32s cubic-bezier(.22,.61,.21,1); }
  /* 面板表头:左=页码与标题(同一淡底块),中=全场时间轴,右=语速下拉。
     历史与备注开关在各自栏的右下角工具条里,不在表头 */
  #notesHead {
    flex: none; display: flex; align-items: center;
    padding: 9px 22px 0; font-size: 13px; color: #d8d6d0;
  }
  /* 页码与标题用一个淡底块包起来,读作一组;标题保持固定槽位,时间轴起点不被标题长短推移 */
  #headChip {
    display: inline-flex; align-items: center; flex: none;
    padding: 3px 12px; margin-right: 18px;
    background: rgba(255,255,255,.05); border-radius: 3px;
  }
  #pageNum { display: inline-flex; align-items: baseline; font-variant-numeric: tabular-nums; min-width: 58px; }
  #pnCur { position: relative; display: inline-block; overflow: hidden; height: 25px; line-height: 25px; font-size: 19px; font-weight: 600; color: #f0eee8; letter-spacing: .04em; }
  #pnCur .nv { display: inline-block; transition: transform .42s cubic-bezier(.22,.61,.21,1), opacity .42s; }
  #pnSep { font-size: 12px; font-weight: 300; color: rgba(255,255,255,.32); margin-left: 7px; letter-spacing: .1em; }
  #pageTitle {
    font-size: 15px; font-weight: 600; color: #8a8781; letter-spacing: .06em; margin-left: 8px;
    flex: none; width: 182px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 全场时间轴:细线=全稿,页边界 1px 刻度;亮线=已讲完,3px 高亮段=当前页(时长标注挂段中点下方),
     白色游标=讲到本页的时间点(累计时间在其上方)。轴线落在 34px 盒子的垂直中点,与表头文字同一中线 */
  #tl { position: relative; flex: 1; height: 34px; margin: 0 10px 0 28px; min-width: 220px; cursor: pointer; }
  #tlPv {
    /* fixed:面板 overflow:hidden 会裁掉探出顶部的部分,fixed 不受祖先裁剪;位置由 JS 按轴矩形算 */
    position: fixed; width: 192px; z-index: 70; pointer-events: none;
    background: var(--chrome); border: 1px solid var(--chair); padding: 4px;
    opacity: 0; visibility: hidden; transform: translateX(-50%) translateY(6px);
    transition: opacity .18s ease, transform .22s cubic-bezier(.22,.61,.21,1), visibility 0s linear .18s;
  }
  #tlPv.on {
    opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
    transition: opacity .18s ease, transform .22s cubic-bezier(.22,.61,.21,1);
  }
  /* 悬停所指页的区间段:5px 软带;颜色随区段状态——已讲过用与亮线一致的高亮度,未讲过用柔和档(JS 设) */
  #tlHov {
    position: absolute; bottom: 14px; height: 5px; background: rgba(240, 238, 232, .35);
    opacity: 0; transition: left .18s ease, width .18s ease, opacity .2s ease, background .2s ease;
    pointer-events: none;
  }
  #tlPv img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
  #tlPv .lbl {
    font-size: 11px; font-weight: 300; letter-spacing: .08em; color: #98968f;
    padding: 5px 2px 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 轴长随语速伸缩:最慢档(×0.6)顶满,宽度=RATE_MIN/rate,内部全百分比定位整体跟随 */
  #tlIn { position: relative; height: 100%; width: 100%; transition: width .55s cubic-bezier(.22,.61,.21,1); }
  #tl .trk { position: absolute; left: 0; right: 0; bottom: 16px; height: 1px; background: rgba(240,238,232,.13); }
  #tl .tick { position: absolute; bottom: 14px; width: 1px; height: 5px; background: rgba(240,238,232,.2); transition: left .55s cubic-bezier(.22,.61,.21,1); }
  #tlFill { position: absolute; left: 0; bottom: 16px; height: 1px; background: rgba(240,238,232,.8); transition: width .55s cubic-bezier(.22,.61,.21,1); }
  #tlCur { position: absolute; bottom: 15px; height: 3px; background: #fff; transition: left .55s cubic-bezier(.22,.61,.21,1), width .55s cubic-bezier(.22,.61,.21,1); }
  #tlHead { position: absolute; bottom: 11px; width: 2px; height: 11px; margin-left: -1px; background: rgba(240,238,232,.9); transition: left .55s cubic-bezier(.22,.61,.21,1); }
  #tlNow { position: absolute; bottom: 23px; transform: translateX(-50%); font-size: 11px; color: rgba(240,238,232,.8); letter-spacing: .06em; font-variant-numeric: tabular-nums; transition: left .55s cubic-bezier(.22,.61,.21,1); }
  /* 本页时长:淡底块包裹,与轴上的其他数字区分 */
  #tlSec {
    position: absolute; bottom: 0; transform: translateX(-50%);
    padding: 2px 7px; background: rgba(255,255,255,.08); border-radius: 2px;
    font-size: 11px; color: rgba(240,238,232,.75); letter-spacing: .06em; font-variant-numeric: tabular-nums;
    transition: left .55s cubic-bezier(.22,.61,.21,1);
  }
  #tlTot { position: absolute; right: 0; bottom: 23px; font-size: 11px; color: rgba(240,238,232,.32); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  /* 图标钮统一规格:32×32 方盒 + 18px 线性图标,悬停反底 */
  .icon-btn {
    width: 32px; height: 32px; padding: 7px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #8a8880; background: none; border: 0; border-radius: 2px; cursor: pointer;
  }
  .icon-btn svg { width: 18px; height: 18px; display: block; }
  .icon-btn:hover { background: var(--paper); color: var(--ink); }
  .icon-btn.on { color: #f0eee8; }
  /* 语速下拉:按倍数选，×1.0 = 210 字/分钟。菜单向上弹,不被面板裁剪(位置由 JS 算) */
  #rateWrap { position: relative; display: flex; }
  #rateBtn {
    display: inline-flex; align-items: center; gap: 5px;
    height: 32px; padding: 0 8px; cursor: pointer;
    font: inherit; font-size: 13px; letter-spacing: .04em; font-variant-numeric: tabular-nums;
    color: #b5b3ac; background: none; border: 0; border-radius: 2px;
  }
  #rateBtn:hover { background: var(--paper); color: var(--ink); }
  #rateWrap.open #rateBtn { color: #f0eee8; }
  #rateWrap.open .caret { transform: rotate(180deg); }
  #rateMenu {
    position: fixed; display: none; flex-direction: column; min-width: 148px;
    background: var(--chrome); border: 1px solid var(--chair); padding: 5px 0; z-index: 60;
  }
  #rateMenu.open { display: flex; }
  #rateMenu button {
    display: flex; align-items: baseline; gap: 12px; text-align: left;
    font: inherit; font-size: 12px; font-weight: 300; color: #98968f;
    background: none; border: 0; padding: 7px 14px; cursor: pointer;
  }
  #rateMenu button:hover { background: var(--paper); color: var(--ink); }
  #rateMenu button.act { color: #f0eee8; }
  #rateMenu .mult { min-width: 34px; font-variant-numeric: tabular-nums; }
  #rateMenu .cpm { font-size: 11px; color: #6f6d67; }
  #rateMenu button:hover .cpm { color: #55524b; }
  /* 栏内右下角工具条:历史与备注开关跟着各自的栏,面板收起时一并消失。
     渐变底与栏同色,编辑区滚到底时文字不会从按钮下穿过 */
  .col-tools {
    position: absolute; right: 22px; bottom: 6px; z-index: 5;
    display: flex; align-items: center; gap: 8px; padding-left: 30px;
  }
  .col.script .col-tools { background: linear-gradient(90deg, rgba(18,18,18,0), var(--chrome) 26%); }
  /* 备注栏:角标贴左、历史贴右,同一行 */
  .col.comm .col-tools {
    left: 22px; justify-content: space-between; padding-left: 0;
    background: linear-gradient(180deg, rgba(23,23,23,0), #171717 40%);
  }
  body.notes-mini .col-tools { display: none; }
  /* 备注角标:填色小标签,高度压在同行图标之内 */
  .col-tag {
    display: inline-flex; align-items: center; height: 20px; padding: 0 8px;
    background: #262b33; color: #9d9b94; border-radius: 2px;
    font-size: 11px; letter-spacing: .12em;
  }
  /* 同步灯:小圆点 + 微弱发光。方盒与图标钮同尺寸,灯与两个图标间距一致 */
  .led-box { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: none; }
  .led {
    width: 6px; height: 6px; border-radius: 50%;
    background: #d99a3a; box-shadow: 0 0 4px 1px rgba(217,154,58,.35);
    transition: background .3s, box-shadow .3s;
  }
  .led.ok { background: #5fa564; box-shadow: 0 0 4px 1px rgba(95,165,100,.32); }
  /* 同步灯的悬停浮层:一行字装不下"哪几页没写回",故单独一层(fixed,不受面板裁剪) */
  #ledPop {
    position: fixed; left: 0; top: 0; z-index: 210; width: 268px;
    background: var(--chrome); border: 1px solid var(--chair); padding: 12px 14px;
    opacity: 0; visibility: hidden; transform: translateY(4px);
    transition: opacity .14s ease, transform .14s ease, visibility 0s linear .14s;
  }
  #ledPop.on {
    opacity: 1; visibility: visible; transform: translateY(0);
    transition: opacity .14s ease, transform .14s ease;
  }
  #ledPop .lp-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #f0eee8; letter-spacing: .04em;
  }
  #ledPop .lp-note { margin-top: 8px; font-size: 11px; line-height: 1.7; color: #8a8880; }
  #ledPop .lp-list { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
  #ledPop .lp-item {
    font: inherit; font-size: 11px; color: #b5b3ac; letter-spacing: .04em;
    background: #262b33; border: 0; border-radius: 2px; padding: 3px 7px; cursor: pointer;
  }
  #ledPop .lp-item:hover { background: var(--paper); color: var(--ink); }
  /* 发送版:去掉一切依赖本地服务的入口与备注 */
  body.send #toolbar button[data-act="prompter"],
  body.send #exMenu button[data-ex="imgs"],
  body.send #exMenu button[data-ex="pdf"],
  body.send #exMenu button[data-ex="send"],
  body.send .led-box,
  body.send #btnDrawer,
  body.send #notesPanel .col.comm { display: none; }
  body.present #notesPanel, body.notes-hidden #notesPanel { display: none; }
  #notesPanel .col {
    min-width: 0; min-height: 0; padding: 12px 22px 0;
    font-size: 13.5px; line-height: 1.8;
    display: flex; flex-direction: column;
  }
  /* min-height:0 两层都不能少——嵌套 flex 里内容会把容器撑高、被面板裁掉,看着溢出却滚不动;
     滚动条隐藏,顶/底极限回弹由 JS 做(批注区回弹一节) */
  #notesPanel .ed { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; outline: none; padding: 2px 4px 16px 0; font-weight: 300; color: #d0cec8; font-size: 15.5px; line-height: 1.6; }
  #notesPanel .ed::-webkit-scrollbar { display: none; }
  #notesPanel .ed b, #notesPanel .ed strong { font-weight: 600; color: #f0eee8; }
  #notesPanel .ed p { margin-bottom: 14px; }
  /* 外部粘贴残留样式兜底:批注区内除加粗外不允许任何样式(白底/字色/字号/斜体/下划线一律压平)。
     只压 p 的子元素:p 本身要承担行类型的颜色(o-task/o-main 等) */
  #notesPanel .ed p * {
    background: transparent !important; color: inherit !important;
    font-family: inherit !important; font-size: inherit !important;
    font-style: normal !important; text-decoration: none !important; letter-spacing: inherit !important;
  }
  #notesPanel .ed b, #notesPanel .ed strong, #notesPanel .ed b *, #notesPanel .ed strong * { color: #f0eee8 !important; }
  #notesPanel .ed ul { padding-left: 18px; }
  #notesPanel .ed li { margin-bottom: 4px; }
  #notesPanel .ed.dirty { background: #1c222a; }
  #nsCols { position: relative; flex: 1; min-height: 0; display: flex; overflow: hidden; }
  #notesPanel .col.script {
    position: relative;
    flex: 1; padding-right: 28px;
    transition: margin-right .34s cubic-bezier(.22,.61,.21,1);
  }
  #notesPanel .col.comm {
    position: absolute; top: 0; bottom: 0; right: 0; width: var(--dw);
    border-left: 1px solid var(--chair); background: #171717;
    transform: translateX(100%);
    transition: transform .34s cubic-bezier(.22,.61,.21,1);
  }
  body.notes-drawer-open #notesPanel .col.script { margin-right: var(--dw); }
  body.notes-drawer-open #notesPanel .col.comm { transform: translateX(0); }
  /* 讲稿与备注的分界:拖动改宽度,悬停/拖动时才显出来 */
  #drawerGrip {
    position: absolute; left: -3px; top: 0; bottom: 0; width: 7px; z-index: 6;
    cursor: col-resize; background: transparent;
  }
  #drawerGrip::after {
    content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 1px;
    background: rgba(255,255,255,.28); opacity: 0; transition: opacity .18s;
  }
  #drawerGrip:hover::after, body.drawer-resizing #drawerGrip::after { opacity: 1; }
  body.drawer-resizing { cursor: col-resize; }
  /* 拖动过程中关掉宽度过渡,不然跟手会迟滞 */
  body.drawer-resizing #notesPanel .col.comm,
  body.drawer-resizing #notesPanel .col.script { transition: none; }
  #notesPanel .col.comm .ed { font-size: 14px; color: #a9a79f; }
  #notesPanel .col.comm .ed p { margin-bottom: 10px; }
  #notesPanel .col.comm .ed p.c-ref { color: #85837c; }
  #notesPanel .col.comm .ed p.c-flag { color: #d8b98a; border-left: 2px solid #a2582f; padding-left: 8px; }
  #edComm:empty::before {
    content: "Add revision notes, context, or personal reminders…";
    color: #68665f; pointer-events: none;
  }
  #histMenu {
    /* fixed 向上弹:迷你态表头贴屏底,向下弹出界;fixed 也不受面板 overflow:hidden 裁剪 */
    position: fixed; display: none;
    flex-direction: column; width: 380px; max-height: 42vh; overflow-y: auto;
    background: var(--chrome); border: 1px solid var(--chair); padding: 5px 0; z-index: 60;
  }
  #histMenu.open { display: flex; }
  #histMenu .hi {
    display: flex; gap: 10px; align-items: baseline; text-align: left;
    font: inherit; font-size: 11px; font-weight: 300; color: #98968f;
    background: none; border: none; padding: 7px 14px; cursor: pointer;
  }
  #histMenu .hi:hover { background: var(--paper); color: var(--ink); }
  #histMenu .ht { color: #5f5d57; flex: none; }
  #histMenu .hx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .draft-flag { color: #d97a3d; font-weight: 600; }

  /* ===== 总览(缩略图恒为静态完成态:入场动画的初始隐藏态只挂 .slide.current/.on 下) ===== */
  #overview {
    position: fixed; inset: 0; z-index: 80; background: rgba(14,14,14,.98);
    display: none; overflow-y: auto; padding: 56px 44px;
  }
  #overview.open { display: block; }
  #ovGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; max-width: 1500px; margin: 0 auto; }
  .ovItem { cursor: pointer; }
  .ovItem .thumbWrap {
    width: 100%; aspect-ratio: 16/9; overflow: hidden;
    outline: 1px solid #333; background: var(--paper); position: relative;
  }
  .ovItem.now .thumbWrap { outline: 2px solid #e8e6df; }
  .ovItem .thumbWrap .canvas {
    transform: scale(var(--ovscale)); transform-origin: top left;
    position: absolute; top: 0; left: 0; box-shadow: none; border: none;
  }
  .ovItem .cap { color: #8a8880; font-weight: 300; font-size: 12px; letter-spacing: .06em; margin-top: 7px; text-align: center; }
  .ovItem.now .cap { color: #f0eee8; font-weight: 600; }

  /* ============================================================
     全局入场/出场:每页画布淡入;旧页绝对定位叠在新页上 450ms 淡出。
     入场动画一律挂 .slide.on(不挂 .current):.on 在 current 与 leaving 期间都保留,
     离场时选择器不变、动画不被重置,入场没播完就翻页时以当前帧继续播并随整页淡出。
     初始隐藏态与 keyframes 只在 .on/.current 下生效,总览缩略图与导出恒为静态终态。
     ============================================================ */
  .slide.on .canvas { animation: cvIn .5s ease; }
  @keyframes cvIn { from { opacity: 0; } }
  .slide.leaving { display: block; position: absolute; z-index: 2; pointer-events: none; animation: cvOut .45s ease forwards; }
  @keyframes cvOut { to { opacity: 0; } }
  /* 满幅贴图页:图 1.6s Ken Burns 缓推收束(个别页要豁免时给画布加 nokb 类) */
  .slide.on .canvas.full-img:not(.nokb) > img { animation: kbIn 1.6s cubic-bezier(.22,.61,.36,1); }
  @keyframes kbIn { from { transform: scale(1.04); } }
  /* 通用入场关键帧:淡入 / 上浮淡入 / 拆字渐显 / 条形生长 */
  @keyframes fwFadeIn { to { opacity: 1; } }
  @keyframes fwUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes chIn { to { opacity: 1; filter: none; } }
  @keyframes barIn { from { width: 0; } }

  /* ============================================================
     示例页样式（替换成自己的页面时可按页面类型删换）
     ============================================================ */
  /* --- 示例:封面(满幅深底+两行标题错峰浮现;换成真图:加 <img> 并给画布加 full-img) --- */
  .pcover .ph-img { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 70% at 50% 42%, #3a3835, #141312 78%); }
  .pcover .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,.54) 42%, rgba(0,0,0,.54) 60%, rgba(0,0,0,.24) 100%); }
  .pcover .cover-title { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; color: #fff; text-shadow: 0 2px 28px rgba(0,0,0,.45); }
  .pcover .co-part { font-size: 26px; font-weight: 200; letter-spacing: .35em; text-indent: .35em; color: rgba(255,255,255,.88); margin-bottom: 46px; }
  .pcover .zh { font-size: 104px; font-weight: 200; letter-spacing: .16em; text-indent: .16em; }
  .pcover .cv-cap { position: absolute; left: 48px; bottom: 40px; font-size: 24px; font-weight: 200; letter-spacing: .06em; color: rgba(255,255,255,.62); }
  .slide.on .pcover .co-part { opacity: 0; animation: fwUp .7s ease .25s forwards; }
  .slide.on .pcover .zh { opacity: 0; animation: fwUp .8s ease .45s forwards; }

  /* --- 示例:正文页(线/面层级:标题成线,正文成段) --- */
  .pbody .bd-title { position: absolute; top: 96px; left: 100px; font-size: 72px; font-weight: 200; letter-spacing: .04em; }
  .pbody .bd-text { position: absolute; top: 320px; left: 100px; width: 900px; font-size: 26px; line-height: 1.9; }
  .pbody .bd-text p + p { margin-top: 40px; }
  .pbody .bd-fig { position: absolute; top: 280px; right: 100px; width: 680px; height: 560px; background: #dedbd2; }
  .pbody .bd-fig span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #777; letter-spacing: .2em; }
  /* 命令行:字面照抄的内容用等宽字与淡底标出,与叙述段落区分 */
  .pbody .bd-cmd {
    position: absolute; left: 100px; top: 300px; width: 1000px; padding: 26px 30px; background: #e5e2d9;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 25px; letter-spacing: .01em;
  }
  /* 命令之后的操作步骤:编号压暗,内容成行 */
  .pbody .bd-steps { position: absolute; left: 100px; top: 500px; width: 1000px; font-size: 26px; line-height: 2.6; }
  .pbody .bd-steps p { display: flex; gap: 22px; }
  .pbody .bd-steps .no { flex: none; color: #8b877f; font-variant-numeric: tabular-nums; }
  /* 目录结构:等宽列表,层级靠缩进 */
  .pbody .bd-tree {
    position: absolute; top: 296px; right: 100px; width: 640px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 24px; line-height: 2.1; color: #55524b;
  }
  .pbody .bd-tree .lv { padding-left: 46px; color: #7b7770; }
  .slide.on .pbody .bd-title { opacity: 0; animation: fwUp .6s ease .1s forwards; }
  .slide.on .pbody .bd-text { opacity: 0; animation: fwFadeIn .7s ease .4s forwards; }
  .slide.on .pbody .bd-fig { opacity: 0; animation: fwFadeIn .7s ease .55s forwards; }
  .slide.on .pbody .bd-cmd { opacity: 0; animation: fwUp .6s ease .35s forwards; }
  .slide.on .pbody .bd-steps { opacity: 0; animation: fwFadeIn .7s ease .55s forwards; }
  .slide.on .pbody .bd-tree { opacity: 0; animation: fwFadeIn .7s ease .55s forwards; }

  /* --- 示例:分步页(data-steps 步进:→ 逐项点亮,未点亮压暗细字;讲到哪亮到哪) --- */
  .psteps { background: #000; color: #fff; }
  .psteps .st-title { position: absolute; top: 88px; left: 100px; font-size: 60px; font-weight: 200; letter-spacing: .1em; }
  .psteps .st-rows { position: absolute; top: 300px; left: 100px; right: 100px; display: flex; flex-direction: column; gap: 0; }
  .psteps .st-row { display: flex; align-items: baseline; gap: 40px; padding: 52px 0; border-top: 1px solid #2c2c2c; opacity: .28; transition: opacity .5s; }
  .psteps .st-row .no { font-size: 44px; font-weight: 200; width: 90px; flex: none; }
  .psteps .st-row .w { font-size: 44px; font-weight: 200; letter-spacing: .04em; transition: font-weight 0s .1s; }
  .psteps .st-row .ex { font-size: 24px; font-weight: 200; color: rgba(255,255,255,.62); margin-left: auto; opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .5s; }
  .psteps[data-step="1"] .st-row:nth-child(1),
  .psteps[data-step="2"] .st-row:nth-child(-n+2),
  .psteps[data-step="3"] .st-row { opacity: 1; }
  .psteps[data-step="1"] .st-row:nth-child(1) .w,
  .psteps[data-step="2"] .st-row:nth-child(2) .w,
  .psteps[data-step="3"] .st-row:nth-child(3) .w { font-weight: 600; }
  .psteps[data-step="1"] .st-row:nth-child(1) .ex,
  .psteps[data-step="2"] .st-row:nth-child(-n+2) .ex,
  .psteps[data-step="3"] .st-row .ex { opacity: 1; transform: none; }
  .slide.on .psteps .st-title { opacity: 0; animation: fwUp .6s ease .1s forwards; }
  /* 入场淡入挂在行容器上:行自身的 opacity 专供步进点亮,两者不再抢同一属性
     (挂在行上再加 both 会把 opacity 锁成 1,压暗规则就永远不生效) */
  .slide.on .psteps .st-rows { opacity: 0; animation: fwFadeIn .55s ease .15s forwards; }
  /* 总览缩略图与导出:步进页恒显终态(全部点亮),不留半亮的中间帧 */
  .ovItem .psteps .st-row, body.exporting .psteps .st-row { opacity: 1; }
  .ovItem .psteps .st-row .ex, body.exporting .psteps .st-row .ex { opacity: 1; transform: none; }

  /* --- 参考骨架:能力矩阵。一列功能 + 两列标记,按 data-step 逐列点亮,
         适合讲「哪些能力自带、哪些需要额外条件」这类二维对照。 --- */
  .pmatrix .mx-title { position: absolute; left: 100px; top: 88px; font-size: 66px; font-weight: 200; }
  .pmatrix .mx { position: absolute; left: 100px; right: 100px; top: 290px; }
  .pmatrix .mx-head, .pmatrix .mx-row { display: grid; grid-template-columns: 1fr 300px 300px; align-items: center; }
  .pmatrix .mx-head { padding-bottom: 16px; font-size: 24px; letter-spacing: .1em; color: #6f6b64; }
  .pmatrix .mx-head span + span, .pmatrix .mx-row .mk { justify-self: center; }
  .pmatrix .mx-row { border-top: 1px solid #ccc9c0; padding: 32px 0; font-size: 30px; }
  .pmatrix .mk { width: 16px; height: 16px; background: var(--ink); opacity: 0; transition: opacity .5s; }
  /* 标记按列点亮:第一步亮「自带」列,第二步补上「本地服务」列;off = 该组合不支持,恒空 */
  .pmatrix[data-step="1"] .mk.c1:not(.off), .pmatrix[data-step="2"] .mk:not(.off) { opacity: 1; }
  .pmatrix .mx-note { position: absolute; left: 100px; right: 100px; bottom: 136px; font-size: 24px; line-height: 1.7; color: #6f6b64; }
  .slide.on .pmatrix .mx-title { opacity: 0; animation: fwUp .6s ease .1s forwards; }
  .slide.on .pmatrix .mx { opacity: 0; animation: fwFadeIn .7s ease .35s forwards; }
  .slide.on .pmatrix .mx-note { opacity: 0; animation: fwFadeIn .7s ease .6s forwards; }
  .ovItem .pmatrix .mk:not(.off), body.exporting .pmatrix .mk:not(.off) { opacity: 1; }

  /* --- 参考骨架:可展开图像列。悬停聚焦一列，其余退后，适合讲分类与案例。 --- */
  .paccordion { display: flex; background: #050505; color: #fff; }
  .paccordion .ac-title { position: absolute; left: 72px; top: 58px; z-index: 5; font-size: 54px; font-weight: 200; }
  .paccordion .ac-col {
    position: relative; flex: 1; min-width: 0; height: 100%;
    border-right: 2px solid #050505; overflow: hidden;
    transition: flex .68s cubic-bezier(.22,.61,.21,1), filter .4s;
  }
  .paccordion .ac-col:nth-child(2) { background: linear-gradient(145deg,#3d3b38,#111 72%); }
  .paccordion .ac-col:nth-child(3) { background: linear-gradient(145deg,#343434,#111 72%); }
  .paccordion .ac-col:nth-child(4) { background: linear-gradient(145deg,#2c2d2e,#111 72%); }
  .paccordion .ac-col:nth-child(5) { background: linear-gradient(145deg,#242424,#111 72%); }
  .paccordion .ac-col:hover { flex: 3.2; }
  .paccordion:has(.ac-col:hover) .ac-col:not(:hover) { filter: brightness(.42) saturate(.55); }
  .paccordion .ac-copy { position: absolute; left: 42px; right: 42px; bottom: 58px; white-space: nowrap; }
  .paccordion .ac-no { font-size: 24px; letter-spacing: .15em; color: rgba(255,255,255,.58); }
  .paccordion .ac-name { margin-top: 12px; font-size: 38px; font-weight: 200; }
  .paccordion .ac-desc { margin-top: 14px; max-width: 500px; font-size: 24px; line-height: 1.65; color: rgba(255,255,255,.68); opacity: 0; transition: opacity .35s .14s; }
  .paccordion .ac-col:hover .ac-desc { opacity: 1; }
  body.exporting .paccordion .ac-col { flex: 1; }
  body.exporting .paccordion .ac-copy { white-space: normal; }
  body.exporting .paccordion .ac-desc { opacity: 1; }
  .ovItem .paccordion .ac-col:nth-child(2) { flex: 3.2; }
  .ovItem .paccordion .ac-col:nth-child(2) .ac-desc { opacity: 1; }

  /* --- 参考骨架:左右对照。适合前后、问题与方案、两个观点的直接比较。 --- */
  .psplit { display: grid; grid-template-columns: 1fr 1fr; background: #0a0a0a; color: #fff; }
  .psplit .sp-half { position: relative; overflow: hidden; }
  .psplit .sp-half:first-child { background: linear-gradient(135deg,#69655d,#292826); }
  .psplit .sp-half:last-child { background: linear-gradient(135deg,#232323,#050505); }
  .psplit .sp-half + .sp-half { border-left: 2px solid #000; }
  .psplit .sp-label { position: absolute; top: 58px; left: 64px; font-size: 24px; letter-spacing: .14em; color: rgba(255,255,255,.68); }
  .psplit .sp-word { position: absolute; left: 64px; bottom: 112px; font-size: 92px; font-weight: 200; }
  .psplit .sp-copy { position: absolute; left: 68px; right: 68px; bottom: 58px; font-size: 24px; color: rgba(255,255,255,.68); }
  .slide.on .psplit .sp-half:first-child { animation: splitLeft .8s cubic-bezier(.22,.61,.21,1); }
  .slide.on .psplit .sp-half:last-child { animation: splitRight .8s cubic-bezier(.22,.61,.21,1); }
  @keyframes splitLeft { from { transform: translateX(-36px); opacity: 0; } }
  @keyframes splitRight { from { transform: translateX(36px); opacity: 0; } }

  /* --- 参考骨架:条形数据。进入页面后按排序依次生长。 --- */
  .pbars .bar-title { position: absolute; left: 100px; top: 86px; font-size: 66px; font-weight: 200; }
  .pbars .bar-list { position: absolute; left: 100px; right: 100px; top: 300px; }
  .pbars .bar-row { display: grid; grid-template-columns: 230px 1fr 120px; align-items: center; gap: 28px; padding: 28px 0; border-top: 1px solid #ccc9c0; }
  .pbars .bar-name { font-size: 24px; }
  .pbars .bar-track { height: 18px; background: #ddd9d0; }
  .pbars .bar-fill { display: block; height: 100%; width: var(--value); background: #111; }
  .pbars .bar-value { font-size: 34px; font-weight: 600; text-align: right; }
  .pbars .bar-meta { position: absolute; left: 100px; bottom: 96px; font-size: 24px; letter-spacing: .04em; color: #6f6b64; }
  .slide.on .pbars .bar-fill { animation: barIn .8s cubic-bezier(.22,.61,.21,1) both; }
  .slide.on .pbars .bar-row:nth-child(2) .bar-fill { animation-delay: .12s; }
  .slide.on .pbars .bar-row:nth-child(3) .bar-fill { animation-delay: .24s; }
  .slide.on .pbars .bar-row:nth-child(4) .bar-fill { animation-delay: .36s; }

  /* --- 参考骨架:单词概念页。作为章节停顿或叙事转折。 --- */
  .pword { background: #000; color: #fff; display: flex; align-items: center; justify-content: center; }
  .pword .word { font-size: 208px; font-weight: 200; letter-spacing: .12em; text-indent: .12em; }
  .pword .word::after { content: ""; display: block; width: 0; height: 1px; margin: 28px auto 0; background: #fff; }
  .slide.on .pword .word { animation: wordLand .9s cubic-bezier(.22,.61,.21,1); }
  .slide.on .pword .word::after { animation: wordLine .9s ease .55s forwards; }
  @keyframes wordLand { from { opacity: 0; transform: scale(.92); letter-spacing: .2em; } }
  @keyframes wordLine { to { width: 180px; } }

  /* --- 示例:结语(满幅深底+金句拆字渐显,拆字由引擎 JS 自动做,文本写在 .line 里即可) --- */
  .pend .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .35), rgba(0, 0, 0, .68) 38%, rgba(0, 0, 0, .68) 72%, rgba(0, 0, 0, .35)); }
  .pend .ph-img { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 70% at 50% 60%, #33322f, #101010 80%); }
  .pend .line { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; color: #fff; font-size: 62px; font-weight: 200; line-height: 2; letter-spacing: .1em; }
  .pend .line .ch { display: inline-block; white-space: pre; } /* pre:拆字后空格仍占宽,英文词不粘连 */
  .slide.on .pend .line .ch { opacity: 0; filter: blur(4px); animation: chIn 1.4s ease forwards; animation-delay: calc(var(--i) * 95ms + .5s); }

  /* ============================================================
     产品短片版式：投影画布 + 演示游标
     一条高对比信号线贯穿生成、修改、提词和交付，页面只保留一句结论与一个视觉主体。
     ============================================================ */
  .vdeck {
    --v-paper: #f2f1ed;
    --v-ink: #000;
    --v-signal: #000;
    --v-shadow: rgba(0,0,0,.12);
    --v-grid: rgba(0,0,0,.11);
    overflow: hidden;
    background: var(--v-paper);
    color: var(--v-ink);
    font-weight: 200;
  }
  .vdeck::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(90deg, transparent 99.85%, var(--v-grid) 100%),
      linear-gradient(transparent 99.8%, var(--v-grid) 100%);
    background-size: 240px 100%, 100% 180px;
    opacity: .42;
  }
  .v-kicker {
    position: absolute;
    top: 78px;
    left: 92px;
    z-index: 3;
    font: 200 19px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--v-signal);
  }
  .v-title {
    position: absolute;
    z-index: 3;
    left: 90px;
    top: 138px;
    max-width: 1120px;
    font-size: 92px;
    line-height: 1.12;
    font-weight: 200;
    letter-spacing: -.055em;
  }
  .v-title em { color: var(--v-signal); font-style: normal; font-weight: 600; }
  .v-title::after {
    display: block;
    margin-top: 24px;
    font: 200 22px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .v-generate .v-title::after { content: "One prompt. A complete presentation."; }
  .v-edit .v-title::after { content: "Edit directly on the canvas."; }
  .v-phone .v-title::after { content: "Your phone becomes the prompter."; }
  .v-export .v-title::after { content: "Ready to deliver."; }
  .v-caption {
    position: absolute;
    z-index: 3;
    left: 94px;
    bottom: 70px;
    color: rgba(0,0,0,.56);
    font-size: 23px;
    font-weight: 200;
    letter-spacing: .02em;
  }
  .v-caption span,
  .v-caption small { display: block; }
  .v-caption small {
    margin-top: 9px;
    font: 200 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .v-corner {
    position: absolute;
    z-index: 3;
    right: 78px;
    top: 72px;
    font: 200 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: rgba(0,0,0,.56);
    letter-spacing: .12em;
  }
  /* 封面：四个卖点就是目录，也是画面的节拍器。 */
  .v-cover { background: #000; color: #fff; }
  .v-cover::before {
    background-image:
      linear-gradient(90deg, transparent 99.85%, rgba(255,255,255,.10) 100%),
      linear-gradient(transparent 99.8%, rgba(255,255,255,.08) 100%);
  }
  .v-cover .v-kicker { color: rgba(255,255,255,.72); }
  .v-cover .cover-mark {
    position: absolute;
    left: 92px;
    top: 166px;
    font: 200 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .18em;
    color: rgba(255,255,255,.46);
  }
  .v-cover .cover-thesis {
    position: absolute;
    left: 88px;
    top: 258px;
    width: 970px;
    font-size: 118px;
    font-weight: 200;
    line-height: 1.02;
    letter-spacing: -.07em;
  }
  .v-cover .cover-thesis::after {
    content: "AI-made decks, ready to present.";
    display: block;
    margin-top: 30px;
    font: 200 22px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .10em;
    text-transform: uppercase;
  }
  .v-cover .cover-features {
    position: absolute;
    right: 86px;
    top: 182px;
    width: 575px;
    z-index: 4;
  }
  .v-cover .cover-feature {
    display: grid;
    grid-template-columns: 42px 1fr;
    align-items: center;
    min-height: 150px;
    border-top: 1px solid rgba(255,255,255,.18);
    font-size: 31px;
    font-weight: 200;
    color: rgba(255,255,255,.78);
    transition: color .25s, transform .35s cubic-bezier(.22,.61,.21,1), border-color .25s;
  }
  .v-cover .cover-feature:last-child { border-bottom: 1px solid rgba(255,255,255,.18); }
  .v-cover .cover-feature span small {
    display: block;
    margin-top: 11px;
    font: 200 16px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .13em;
    color: rgba(255,255,255,.44);
    text-transform: uppercase;
  }
  .v-cover .cover-feature i {
    width: 8px;
    height: 8px;
    background: #fff;
    transform: rotate(45deg);
    transition: transform .35s;
  }
  .v-cover .cover-feature:hover {
    color: #fff;
    border-color: #fff;
    transform: translateX(-18px);
  }
  .v-cover .cover-feature:hover i { transform: rotate(135deg) scale(1.5); }
  .v-cover .cover-foot {
    position: absolute;
    left: 94px;
    bottom: 72px;
    color: rgba(255,255,255,.50);
    font-size: 24px;
    font-weight: 200;
  }
  .slide.on .v-cover .cover-thesis { animation: vThesisIn .75s cubic-bezier(.22,.61,.21,1) both; }
  .slide.on .v-cover .cover-feature { opacity: 0; animation: vRowIn .5s ease forwards; }
  .slide.on .v-cover .cover-feature:nth-child(1) { animation-delay: .28s; }
  .slide.on .v-cover .cover-feature:nth-child(2) { animation-delay: .40s; }
  .slide.on .v-cover .cover-feature:nth-child(3) { animation-delay: .52s; }
  .slide.on .v-cover .cover-feature:nth-child(4) { animation-delay: .64s; }
  /* 生成：三张内容层从提示词轨道中依次装配。 */
  .v-generate .v-title { max-width: 920px; }
  .v-prompt {
    position: absolute;
    left: 94px;
    top: 530px;
    width: 680px;
    padding: 28px 34px;
    border-left: 2px solid var(--v-signal);
    background: #fff;
    font-size: 29px;
    box-shadow: 14px 14px 0 var(--v-shadow);
  }
  .v-prompt::after {
    content: "";
    position: absolute;
    left: 100%;
    top: 50%;
    width: 228px;
    height: 1px;
    background: var(--v-signal);
    transform-origin: left;
  }
  .v-stack { position: absolute; right: 90px; top: 185px; width: 760px; height: 690px; }
  .v-sheet {
    position: absolute;
    width: 620px;
    height: 348px;
    padding: 34px;
    border: 1px solid var(--v-ink);
    background: rgba(255,255,255,.96);
    box-shadow: 14px 14px 0 var(--v-shadow);
    transition: transform .68s cubic-bezier(.22,.61,.21,1);
    will-change: transform;
  }
  .v-sheet:nth-child(1) { left: 0; top: 0; transform: rotate(-5deg); transition-delay: .16s; }
  .v-sheet:nth-child(2) { left: 72px; top: 150px; transform: rotate(2deg); transition-delay: .08s; }
  .v-sheet:nth-child(3) { left: 18px; top: 304px; transform: rotate(-1deg); transition-delay: 0s; }
  .v-stack:hover .v-sheet:nth-child(1) { transform: translate(-22px,-18px) rotate(-7deg); transition-delay: 0s; }
  .v-stack:hover .v-sheet:nth-child(2) { transform: translate(25px,-2px) rotate(4deg); transition-delay: .08s; }
  .v-stack:hover .v-sheet:nth-child(3) { transform: translate(-12px,20px) rotate(-2deg); transition-delay: .16s; }
  .v-sheet .sheet-type {
    font: 200 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .14em;
    color: var(--v-signal);
  }
  .v-sheet .sheet-main { margin-top: 56px; font-size: 53px; font-weight: 200; letter-spacing: -.04em; }
  .v-sheet .sheet-lines { margin-top: 34px; display: grid; gap: 12px; }
  .v-sheet .sheet-lines i { display: block; height: 8px; background: rgba(0,0,0,.18); }
  .v-sheet .sheet-lines i:nth-child(2) { width: 72%; }
  .slide.on .v-generate .v-prompt { opacity: 0; animation: vRowIn .55s ease .18s forwards; }
  .slide.on .v-generate .v-prompt::after { animation: vLineOut .55s ease .55s both; }
  .slide.on .v-generate .v-sheet { opacity: 0; animation: vAssemble .65s cubic-bezier(.22,.61,.21,1) forwards; }
  .slide.on .v-generate .v-sheet:nth-child(1) { animation-delay: .58s; }
  .slide.on .v-generate .v-sheet:nth-child(2) { animation-delay: .72s; }
  .slide.on .v-generate .v-sheet:nth-child(3) { animation-delay: .86s; }

  /* 修改：编辑前后在同一块画布里发生，光标承担视觉主角。 */
  .v-edit .v-title { top: 122px; }
  .v-editor {
    position: absolute;
    left: 94px;
    right: 94px;
    top: 360px;
    height: 470px;
    border-top: 1px solid var(--v-ink);
    border-bottom: 1px solid var(--v-ink);
    display: flex;
    align-items: center;
    overflow: hidden;
    background: rgba(255,255,255,.58);
  }
  .v-editor .edit-before,
  .v-editor .edit-after {
    position: absolute;
    left: 62px;
    font-size: 104px;
    font-weight: 200;
    letter-spacing: -.06em;
  }
  .v-editor .edit-before { color: rgba(0,0,0,.36); font-weight: 200; }
  .v-editor .edit-before::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 57%;
    height: 2px;
    background: var(--v-signal);
    transform-origin: left;
  }
  .v-editor .edit-after { color: var(--v-ink); opacity: 0; transform: translateY(40px); font-weight: 600; }
  .v-editor .edit-caret {
    display: inline-block;
    width: 3px;
    height: .92em;
    margin-left: 10px;
    vertical-align: -.06em;
    background: var(--v-signal);
  }
  .v-editor .edit-status {
    position: absolute;
    right: 46px;
    bottom: 32px;
    font: 600 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--v-signal);
    letter-spacing: .08em;
  }
  .slide.on .v-editor .edit-before { animation: vOldOut .35s ease 1.15s forwards; }
  .slide.on .v-editor .edit-before::after { animation: vLineOut .45s ease .62s both; }
  .slide.on .v-editor .edit-after { animation: vNewIn .48s cubic-bezier(.22,.61,.21,1) 1.25s forwards; }
  .slide.on .v-editor .edit-caret { animation: vCaret 1s steps(1) 1.35s infinite; }
  .slide.on .v-editor .edit-status { opacity: 0; animation: fwFadeIn .35s ease 1.65s forwards; }

  /* 手机：一条同步信号从电脑画面穿进手机，再由手机把翻页动作送回去。 */
  .v-phone { background: #000; color: #fff; }
  .v-phone::before {
    background-image:
      linear-gradient(90deg, transparent 99.85%, rgba(255,255,255,.10) 100%),
      linear-gradient(transparent 99.8%, rgba(255,255,255,.08) 100%);
  }
  .v-phone .v-kicker { color: rgba(255,255,255,.72); }
  .v-phone .v-title { color: #fff; max-width: 900px; }
  .v-phone .v-title em { color: #fff; }
  .v-phone .v-caption { color: rgba(255,255,255,.52); }
  .v-device-stage { position: absolute; right: 180px; top: 156px; width: 850px; height: 760px; }
  .v-screen {
    position: absolute;
    left: 0;
    top: 114px;
    width: 690px;
    height: 430px;
    border: 1px solid rgba(255,255,255,.72);
    padding: 42px;
    background: #000;
  }
  .v-screen .screen-title { font-size: 48px; font-weight: 600; letter-spacing: -.04em; }
  .v-screen .screen-bar { width: 62%; height: 10px; margin-top: 46px; background: rgba(255,255,255,.34); }
  .v-screen .screen-bar + .screen-bar { width: 42%; margin-top: 16px; }
  .v-phone-body {
    position: absolute;
    right: 0;
    top: 0;
    width: 300px;
    height: 650px;
    border: 2px solid #f2f1ed;
    background: #f2f1ed;
    color: var(--v-ink);
    padding: 54px 30px 28px;
    box-shadow: 14px 14px 0 rgba(255,255,255,.20);
    transition: transform .35s cubic-bezier(.22,.61,.21,1);
  }
  .v-phone-body:hover { transform: translateY(-18px) rotate(1deg); }
  .v-phone-body::before {
    content: "";
    position: absolute;
    top: 20px;
    left: 50%;
    width: 70px;
    height: 3px;
    transform: translateX(-50%);
    background: #000;
  }
  .v-phone-body .phone-page { font: 200 17px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--v-signal); }
  .v-phone-body .phone-copy { margin-top: 48px; font-size: 28px; line-height: 1.75; font-weight: 200; }
  .v-phone-body .phone-copy b { color: var(--v-signal); font-weight: 600; }
  .v-phone-body .phone-controls {
    position: absolute;
    left: 28px;
    right: 28px;
    bottom: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-top: 1px solid var(--v-ink);
  }
  .v-phone-body .phone-controls span { padding-top: 19px; font-size: 28px; text-align: center; }
  .v-phone-body .phone-controls span + span { border-left: 1px solid var(--v-ink); }
  .v-sync-line {
    position: absolute;
    left: 480px;
    top: 330px;
    width: 184px;
    height: 1px;
    background: #fff;
    transform-origin: left;
  }
  .v-sync-line::after {
    content: "";
    position: absolute;
    right: -4px;
    top: -3px;
    width: 8px;
    height: 8px;
    background: #fff;
    transform: rotate(45deg);
  }
  .slide.on .v-phone .v-screen { opacity: 0; animation: vDeviceIn .58s ease .20s forwards; }
  .slide.on .v-phone .v-phone-body { opacity: 0; animation: vPhoneIn .72s cubic-bezier(.22,.61,.21,1) .52s forwards; }
  .slide.on .v-phone .v-sync-line { animation: vLineOut .55s ease .95s both; }

  /* 交付：一个母版向三种交付物展开，不再用功能列表。 */
  .v-export .v-title { max-width: 890px; }
  .v-export-stage { position: absolute; right: 76px; top: 164px; width: 900px; height: 760px; }
  .v-master-page {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 4;
    width: 420px;
    height: 238px;
    transform: translate(-50%,-50%);
    border: 1px solid var(--v-ink);
    background: #fff;
    box-shadow: 14px 14px 0 var(--v-shadow);
  }
  .v-master-page::before {
    content: "";
    position: absolute;
    left: 34px;
    top: 38px;
    width: 220px;
    height: 21px;
    background: var(--v-ink);
    box-shadow: 0 47px 0 rgba(0,0,0,.18), 0 77px 0 rgba(0,0,0,.18);
  }
  .v-master-page::after {
    content: "▶";
    position: absolute;
    right: 32px;
    bottom: 27px;
    color: var(--v-signal);
    font-size: 34px;
  }
  .v-output {
    position: absolute;
    z-index: 3;
    width: 250px;
    height: 150px;
    border: 1px solid var(--v-ink);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 200 34px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .08em;
    transition: background .25s, color .25s, transform .3s;
  }
  .v-output:hover { background: var(--v-ink); color: #fff; transform: scale(1.05); }
  .v-output.o-png { left: 36px; top: 80px; }
  .v-output.o-pdf { right: 32px; top: 86px; }
  .v-output.o-html { left: 324px; bottom: 50px; }
  .v-output-line {
    position: absolute;
    z-index: 1;
    height: 1px;
    background: var(--v-signal);
    transform-origin: left center;
  }
  .v-output-line.l1 { left: 161px; top: 230px; width: 106px; transform: rotate(41deg); }
  .v-output-line.l2 { left: 660px; top: 299px; width: 106px; transform: rotate(-39deg); }
  .v-output-line.l3 { left: 450px; top: 499px; width: 1px; height: 61px; transform: none; transform-origin: top; }
  .slide.on .v-export .v-master-page { opacity: 0; animation: vMasterIn .55s ease .15s forwards; }
  .slide.on .v-export .v-output-line { animation: vRevealLine .55s ease .56s both; }
  .slide.on .v-export .v-output { opacity: 0; animation: vPop .45s cubic-bezier(.22,.61,.21,1) forwards; }
  .slide.on .v-export .o-png { animation-delay: .82s; }
  .slide.on .v-export .o-pdf { animation-delay: .94s; }
  .slide.on .v-export .o-html { animation-delay: 1.06s; }

  /* 封尾：信号游标收拢为舞台中央的一道竖线。 */
  .v-end { background: #000; color: #fff; }
  .v-end::before { display: none; }
  .v-end .end-mark {
    position: absolute;
    left: 50%;
    top: 134px;
    width: 2px;
    height: 166px;
    background: rgba(255,255,255,.72);
    transform-origin: top;
  }
  .v-end .end-line {
    position: absolute;
    left: 160px;
    right: 160px;
    top: 390px;
    text-align: center;
    font-size: 92px;
    line-height: 1.28;
    font-weight: 200;
    letter-spacing: -.055em;
  }
  .v-end .end-line::after {
    content: "Make AI presentations work better.";
    display: block;
    margin-top: 28px;
    font: 200 22px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .10em;
    text-transform: uppercase;
  }
  .v-end .end-name {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 92px;
    text-align: center;
    font: 200 21px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .20em;
    color: rgba(255,255,255,.72);
  }
  .slide.on .v-end .end-mark { animation: vSignalDown .8s cubic-bezier(.22,.61,.21,1) both; }
  .slide.on .v-end .end-line { opacity: 0; animation: vEndIn .75s cubic-bezier(.22,.61,.21,1) .48s forwards; }
  .slide.on .v-end .end-name { opacity: 0; animation: fwFadeIn .5s ease 1s forwards; }

  .slide.on .vdeck .v-kicker,
  .slide.on .vdeck .v-title,
  .slide.on .vdeck .v-caption,
  .slide.on .vdeck .v-corner { opacity: 0; animation: vRowIn .55s ease forwards; }
  .slide.on .vdeck .v-kicker { animation-delay: .06s; }
  .slide.on .vdeck .v-title { animation-delay: .15s; }
  .slide.on .vdeck .v-caption { animation-delay: .34s; }
  .slide.on .vdeck .v-corner { animation-delay: .24s; }

  @keyframes vThesisIn { from { opacity: 0; transform: translateY(30px); letter-spacing: -.02em; } }
  @keyframes vRowIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes vSignalDown { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes vRevealLine { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
  @keyframes vLineOut { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes vAssemble { from { opacity: 0; translate: 160px 0; } to { opacity: 1; translate: 0 0; } }
  @keyframes vOldOut { to { opacity: 0; transform: translateY(-30px); } }
  @keyframes vNewIn { to { opacity: 1; transform: none; } }
  @keyframes vCaret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes vDeviceIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @keyframes vPhoneIn { from { opacity: 0; transform: translate(70px,35px) rotate(4deg); } to { opacity: 1; transform: none; } }
  @keyframes vMasterIn { from { opacity: 0; transform: translate(-50%,-50%) scale(.88); } to { opacity: 1; } }
  @keyframes vPop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
  @keyframes vEndIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  /* 总览和导出必须是静态终态，不能截到入场前或动画中间。 */
  .ovItem .vdeck *, body.exporting .vdeck *, body.raw .vdeck * { animation: none !important; opacity: 1 !important; }
  .ovItem .vdeck * { pointer-events: none; }

// ===== 项目配置:新 deck 只改这里 =====
var DECK = {
  name: '本地演示台', // 页脚线左侧的项目名
  key: 'hanyu-html-deck.v2', // localStorage 键前缀。页序变动或讲稿并入种子时升版本号
  port: 8123          // 本地提词服务端口
};
// 发送版标记:build_send.py 导出时置 true。发送版不联本地服务,
// 不写回、不提词、不导出,备注与相关入口一并隐藏。
var SEND_VERSION = false;
(function () {
  var SRV = 'http://127.0.0.1:' + DECK.port;
  // 访问凭据:本地服务启动时写进下面这一行,停止时清空。写回要求它——浏览器里的
  // 任意网页都能伪装成本地文件,只看"来自本机"挡不住,凭据才是网页拿不到的东西。
  // 这行的 HANYU_TOKEN 标记是服务端定位用的锚点,不要删。
  // 服务没在跑、或页面在服务启动前就打开了:仍可演示与编辑,但改动只留在浏览器里。
  var TOKEN = ''; /* HANYU_TOKEN */
  function api(path) {
    return SRV + path + (path.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(TOKEN);
  }
  // 存储包装:隐私模式、企业策略或配额写满时,裸调用 localStorage 会抛异常。
  // 这些调用散在初始化与翻页路径上,一抛就整页白屏、演示中翻不动页——
  // 故一律走这里,读写失败就退回内存,功能降级但演示不中断。
  var localStorage = (function () {
    var mem = {};
    var real = null;
    try {
      real = window.localStorage;
      var probe = '__hd_probe__';
      real.setItem(probe, '1');
      real.removeItem(probe);
    } catch (e) {
      real = null;
    }
    return {
      getItem: function (k) {
        try { return real ? real.getItem(k) : (k in mem ? mem[k] : null); }
        catch (e) { return k in mem ? mem[k] : null; }
      },
      setItem: function (k, v) {
        mem[k] = String(v);
        try { if (real) real.setItem(k, v); } catch (e) {}
      },
      removeItem: function (k) {
        delete mem[k];
        try { if (real) real.removeItem(k); } catch (e) {}
      },
      key: function (i) { try { return real ? real.key(i) : Object.keys(mem)[i]; } catch (e) { return null; } },
      get length() { try { return real ? real.length : Object.keys(mem).length; } catch (e) { return 0; } }
    };
  })();
  var tpl = document.getElementById('slides');
  var slides = Array.prototype.slice.call(tpl.content.querySelectorAll('.slide'));
  var stage = document.getElementById('stage');
  var total = slides.length;
  var cur = 0;

  // 把模板里的页面搬进舞台;代码页统一注入页脚线(满幅图页与带 nofoot 类的画布跳过)
  slides.forEach(function (s, i) {
    s.dataset.page = i + 1;
    var c = s.querySelector('.canvas');
    if (c && !c.classList.contains('full-img') && !c.classList.contains('nofoot')) {
      var f = document.createElement('div');
      f.className = 'pfoot';
      f.innerHTML = '<span>' + DECK.name + '</span><span class="pn">' +
        String(i + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0') + '</span>';
      c.appendChild(f);
    }
    stage.appendChild(s);
  });
  slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));

  var pnCur = document.getElementById('pnCur');
  var pnSep = document.getElementById('pnSep');
  var pageTitle = document.getElementById('pageTitle');

  // 语速用倍数表示:×1.0 = 210 字/分钟。轴长以最慢档为满幅基准

  var tlSec = document.getElementById('tlSec');

  function updateTime() {

    for (var i = 0; i < total; i++) {

  tl.addEventListener('pointermove', function (e) {

  edScript.addEventListener('input', updateTime);
  // ===== 版本历史:讲稿与备注各一条时间线(localStorage 键 <ed.hkey>N,数组,上限 30 条)。
  // 记录时机:离开改过的页、自动写回前、从历史恢复前——恢复永不丢当前稿。
  // 自动写回每次停顿都会记,故同页同栏一分钟内只保留一条,不然 30 条很快被连续输入刷空 =====
  var SNAP_MERGE_MS = 60000;
  function histOf(i, ed) {
    try { return JSON.parse(localStorage.getItem(ed.hkey + (i + 1))) || []; }
    catch (e) { return []; }
  }
  function snapHist(i, ed) {
    var h = localStorage.getItem(ed.key + (i + 1));
    if (!h) return;                       // 与默认稿一致(无改动)不记
    var arr = histOf(i, ed);
    var last = arr[arr.length - 1];
    if (last && ed.canon(last.h) === ed.canon(h)) return;   // 与最近一条相同不重复记
    var now = Date.now();
    if (last && now - last.t < SNAP_MERGE_MS) arr[arr.length - 1] = { t: now, h: h };
    else arr.push({ t: now, h: h });
    if (arr.length > 30) arr = arr.slice(arr.length - 30);
    localStorage.setItem(ed.hkey + (i + 1), JSON.stringify(arr));
  }
  function snapAll(i) { EDS.forEach(function (ed) { snapHist(i, ed); }); }
  var histMenu = document.getElementById('histMenu');
  var histMenuEd = EDS[0];
  function fmtT(t) {
    var d = new Date(t);
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }
  function buildHist(ed) {
    histMenu.innerHTML = '';
    function add(label, html, k) {
      normBox.innerHTML = html;
      var b = document.createElement('button');
      b.className = 'hi'; b.dataset.k = k;
      var t1 = document.createElement('span'); t1.className = 'ht'; t1.textContent = label;
      var t2 = document.createElement('span'); t2.className = 'hx';
      t2.textContent = normBox.innerText.replace(/\s+/g, ' ').trim().slice(0, 46);
      b.appendChild(t1); b.appendChild(t2); histMenu.appendChild(b);
    }
    var arr = histOf(cur, ed);
    for (var k = arr.length - 1; k >= 0; k--) add(fmtT(arr[k].t), arr[k].h, String(k));
    add('Default', seedOf(cur, ed), 'seed');

  Array.prototype.forEach.call(document.querySelectorAll('.hist-btn'), function (btn) {

    saveNote();

    if (b.dataset.k === 'seed') localStorage.removeItem(ed.key + (cur + 1));
    else {
      var it = histOf(cur, ed)[+b.dataset.k];

  // ===== 自动写回:输入停顿后把改动页静默写回源文件,不需要用户点保存 =====
  // 状态只用一盏灯表达:绿=都已落盘,橙黄=还有改动只在浏览器里(服务没开/被拒/正在写)
  function fragOfPage(i, ed) {
    return ed.canon(localStorage.getItem(ed.key + (i + 1)) || '');
  }
  var syncLed = document.getElementById('syncLed');
  var ledPop = document.createElement('div');
  ledPop.id = 'ledPop';
  document.body.appendChild(ledPop);
  var ledState = { ok: true, why: '', pending: [], down: false, noToken: false };
  function dirtyPages() {
    var out = [];
    slides.forEach(function (s, i) {
      EDS.forEach(function (ed) {
        if (localStorage.getItem(ed.key + (i + 1))) out.push({ i: i, ed: ed });
      });
    });
    return out;
  }
  // 浮层内容随状态生成:一行字装不下"哪几页没写回",列成可点的条目直接跳过去
  function buildLedPop() {
    ledPop.innerHTML = '';
    var head = document.createElement('div');
    head.className = 'lp-head';
    var dot = document.createElement('i');
    dot.className = 'led' + (ledState.ok ? ' ok' : '');
    head.appendChild(dot);
    var title = document.createElement('span');
    title.textContent = ledState.ok ? 'Script and notes are saved to file' : ledState.pending.length + ' change(s) not written to file';
    head.appendChild(title);
    ledPop.appendChild(head);
    var note = document.createElement('p');
    note.className = 'lp-note';
    note.textContent = ledState.noToken
      ? 'This page opened before the local service and has no write-back token. Refresh the page to reconnect.'
      : ledState.down
        ? 'The local service is offline. Changes remain in this browser until you start the launcher.'
        : (ledState.ok ? 'Changes write back to index.html about 1.5 seconds after you stop typing.' : 'Waiting to write back after typing stops.');
    ledPop.appendChild(note);
    if (ledState.pending.length) {
      var list = document.createElement('div');
      list.className = 'lp-list';
      ledState.pending.slice(0, 8).forEach(function (c) {
        var b = document.createElement('button');

        b.addEventListener('click', function () { ledPopHide(true); go(c.i); });

      if (ledState.pending.length > 8) {
        var more = document.createElement('span');
        more.className = 'lp-item';
        more.style.cursor = 'default';
        more.textContent = (ledState.pending.length - 8) + ' more';
        list.appendChild(more);
      }
      ledPop.appendChild(list);
    }
  }
  var ledPopT = null;
  function ledPopShow() {
    clearTimeout(ledPopT);
    buildLedPop();
    var r = syncLed.getBoundingClientRect();
    var box = ledPop.getBoundingClientRect();
    ledPop.style.left = Math.min(Math.max(r.left + r.width / 2 - box.width / 2, 8), window.innerWidth - box.width - 8) + 'px';
    ledPop.style.top = Math.max(r.top - box.height - 10, 8) + 'px';
    ledPop.classList.add('on');
  }
  function ledPopHide(now) {
    clearTimeout(ledPopT);
    if (now) { ledPop.classList.remove('on'); return; }
    ledPopT = setTimeout(function () { ledPop.classList.remove('on'); }, 180);
  }
  syncLed.parentNode.addEventListener('mouseenter', ledPopShow);
  syncLed.parentNode.addEventListener('mouseleave', function () { ledPopHide(); });
  ledPop.addEventListener('mouseenter', function () { clearTimeout(ledPopT); });
  ledPop.addEventListener('mouseleave', function () { ledPopHide(); });
  function setLed(ok, why, down, noToken) {
    syncLed.classList.toggle('ok', !!ok);
    ledState = { ok: !!ok, why: why, pending: dirtyPages(), down: !!down, noToken: !!noToken };
    if (ledPop.classList.contains('on')) ledPopShow();
  }
  function refreshLed() {
    var n = dirtyPages().length;
    if (!n) setLed(true, 'Script and notes are saved to index.html', false, false);
    else setLed(false, n + ' change(s) not written to file', ledState.down, ledState.noToken);
  }
  var seedTimer = null, seedChain = Promise.resolve(), seedBusy = false;
  function scheduleSeed() {
    if (SEND_VERSION) return;              // 发送版不写回:收件人本机可能也跑着服务
    clearTimeout(seedTimer);
    refreshLed();
    seedTimer = setTimeout(seedNow, 1500);
  }
  function seedNow() {
    if (SEND_VERSION) return;
    clearTimeout(seedTimer);
    var changed = dirtyPages();
    if (!changed.length || seedBusy) { refreshLed(); return; }
    seedBusy = true;
    var down = false, noToken = false;
    changed.forEach(function (c) {
      seedChain = seedChain.then(function () {
        if (down) return;
        var frag = fragOfPage(c.i, c.ed);
        if (!frag) return;                 // 内容为空不写,留在浏览器里等下一次
        return fetch(api('/seed'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ page: c.i + 1, total: total, html: frag, sel: c.ed.sel.slice(1) })
        }).then(function (r) {
          if (r.status === 403) noToken = true;   // 缺凭据:得从启动脚本打开才能写回
          return r.json();
        }).then(function (d) {
          if (!d.ok) return;               // 被拒:改动留在浏览器,灯保持橙黄
          snapHist(c.i, c.ed);
          var src = slides[c.i].querySelector('aside ' + c.ed.sel);
          if (src) src.innerHTML = frag;
          localStorage.removeItem(c.ed.key + (c.i + 1));
          if (c.i === cur) c.ed.el.classList.remove('dirty');
        }, function () { down = true; });   // 服务没在跑:静默留在浏览器
      });
    });

      seedBusy = false;
      if (down) setLed(false, 'Local service offline', true);
