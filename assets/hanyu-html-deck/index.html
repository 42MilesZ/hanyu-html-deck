      else refreshLed();
    });
  }

  // ===== CVEDIT-START（发送版由 build_send.py 剥除）=====
  // ===== 画布就地编辑:双击画布文字直接改,失焦后整块画布经本地提词服务写回本文件源文 =====
  // 用途=不必为增删一两个字改代码。写回粒度=整个 .canvas 的 innerHTML
  // (源文里的缩进/换行是文本节点,浏览器序列化原样保留,所以改一个字只产生一行 diff);
  // 服务端锚定画布块后面的 </div><aside> 定位边界,并核对页数——文件在别处被改过就拒写。
  // 前提:每页结构恒为 .canvas 紧跟 <aside>(与批注写回同一约定),别打破。
  (function () {
    var toastEl = document.getElementById('cvToast'), toastT = null;
    function toast(msg, bad) {
      toastEl.textContent = msg;
      toastEl.classList.toggle('bad', !!bad);
      toastEl.classList.add('on');
      clearTimeout(toastT);
      toastT = setTimeout(function () { toastEl.classList.remove('on'); }, bad ? 6000 : 2200);
    }
    function serializeCanvas(c) {
      var clone = c.cloneNode(true);
      // 编辑态属性不属于源文:关窗时的 beacon 会在元素仍可编辑时序列化,不清掉就会写进文件
      Array.prototype.slice.call(clone.querySelectorAll('[contenteditable]')).forEach(function (el) {
        el.removeAttribute('contenteditable');
        el.classList.remove('cv-editing');
        if (!el.className) el.removeAttribute('class');
      });
      // 页脚线由引擎进页时注入,不属于源文:写回前摘掉,否则每存一次就在源文里多积一条
      Array.prototype.slice.call(clone.querySelectorAll('.pfoot')).forEach(function (f) { f.remove(); });
      // 金句逐字动画把文本拆成了 .ch 字符 span:写回前还原成纯文本,不把几百个 span 烙进源文件
      Array.prototype.slice.call(clone.querySelectorAll('span.ch')).forEach(function (s) {
        s.replaceWith(document.createTextNode(s.textContent));
      });
      return clone.innerHTML;
    }
    var editEl = null, editCanvas = null, editSnap = '', elSnap = '';
    var postChain = Promise.resolve();   // 串行:连改两处时后发的请求不会带着旧快照抢先落盘
    function endEdit() {
      if (!editEl) return;
      var el = editEl, c = editCanvas, was = editSnap;
      editEl = null; editCanvas = null;
      el.removeAttribute('contenteditable');
      el.classList.remove('cv-editing');
      var frag = serializeCanvas(c);
      if (frag === was) return;
      var pageNo = parseInt(c.closest('.slide').dataset.page, 10);
      var body = JSON.stringify({ page: pageNo, total: total, html: frag });
      postChain = postChain.then(function () {
        return fetch(api('/canvas'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d.ok) toast('P' + pageNo + ' canvas changes written to source');
          else toast('Write-back failed. Check the local service.', true);
        }, function () {
          toast('The local service is offline. Changes remain in this window and will be lost on refresh. Start the launcher, then edit once to write them back.', true);
        });
      });
      return postChain;
    }
    function cancelEdit() {
      if (!editEl) return;
      var el = editEl;
      editEl = null; editCanvas = null;
      el.innerHTML = elSnap;             // Esc = 放弃这次改动,不落盘
      el.removeAttribute('contenteditable');
      el.classList.remove('cv-editing');
      el.blur();
    }
    stage.addEventListener('dblclick', function (e) {
      if (view !== 'default') return;                     // 演示/总览态不进编辑
      var el = e.target;
      if (!el.closest) return;
      var c = el.closest('.canvas');
      if (!c || !slides[cur].contains(c)) return;
      if (el.tagName === 'IMG' || el.closest('svg')) return;
      // 双击容器内边距时 e.target 是容器本身,整块可编辑太容易误清空:收敛到最近的文本块;
      // 逐字动画的 .ch 单字 span 不能当编辑单元,上提到它所在的行
      if (el.classList.contains('ch')) el = el.parentNode;
      el = el.closest('p, td, th, li, .line') || el;
      if (el === c || !c.contains(el)) return;
      if (editEl === el) return;
      endEdit();
      editEl = el; editCanvas = c;
      editSnap = serializeCanvas(c);
      elSnap = el.innerHTML;
      el.setAttribute('contenteditable', 'true');
      el.classList.add('cv-editing');
      el.focus();
    });
    // blur 不冒泡,focusout 冒泡:点画布外任意处都会走到这里存一次
    stage.addEventListener('focusout', function (e) {
      if (editEl && e.target === editEl) endEdit();
    });
    stage.addEventListener('keydown', function (e) {
      if (!editEl || !editEl.contains(e.target)) return;
      // 原生回车会包 <div> 污染源文,统一转 <br>
      if (e.key === 'Enter') { e.preventDefault(); document.execCommand('insertHTML', false, '<br>'); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancelEdit(); }
    });
    stage.addEventListener('paste', function (e) {
      if (!editEl || !editEl.contains(e.target)) return;
      e.preventDefault();
      var t = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
      if (t) document.execCommand('insertText', false, t);
    });
    // 拖拽落入不走 paste:整段富文本(div/style/font)会直接进源文件,一律拦掉
    stage.addEventListener('drop', function (e) {
      if (editEl) e.preventDefault();
    });
    // 关窗/刷新时元素不失焦,改动会静默丢:sendBeacon 在页面销毁前也能把最后一次改动送出
    window.addEventListener('beforeunload', function () {
      if (!editEl) return;
      var c = editCanvas, was = editSnap;
      var frag = serializeCanvas(c);
      if (frag === was || !navigator.sendBeacon) return;
      var payload = JSON.stringify({ page: parseInt(c.closest('.slide').dataset.page, 10), total: total, html: frag });
      // 用 text/plain 发:beacon 不支持预检,服务端只读 body 不看 Content-Type
      navigator.sendBeacon(api('/canvas'), new Blob([payload], { type: 'text/plain' }));
    });
  })();
  // ===== CVEDIT-END =====

  // ===== 页内分步(canvas 带 data-steps 的页,→ 先展开节点再翻页) =====
  function stepsOf(i) {
    var c = slides[i].querySelector('.canvas');
    return c && c.dataset.steps ? parseInt(c.dataset.steps, 10) : 0;
  }
  function stepOf(i) {
    var c = slides[i].querySelector('.canvas');
    return c && c.dataset.step ? parseInt(c.dataset.step, 10) : 0;
  }
  function initStepOf(i) {
    var c = slides[i].querySelector('.canvas');
    return c && c.dataset.initstep ? parseInt(c.dataset.initstep, 10) : 0;
  }
  function setStep(i, n) {
    var c = slides[i].querySelector('.canvas');
    if (c) c.dataset.step = n;
    if (i === cur) prFlip(); // 步进(含 data-autostep 定时器)也同步给手机提词页,预览帧跟着换
  }

  var autoTimer = null;
  var leaveTimer = null, leavingEl = null;
  function go(i, skipSave) {
    if (i < 0 || i >= total) return;
    var dirn = i >= cur ? 1 : -1;
    if (!skipSave) { saveNote(); snapAll(cur); seedNow(); }
    clearTimeout(autoTimer);
    // 出场:旧页加 .leaving 绝对定位叠在新页上淡出 450ms(快速连翻时立刻清掉上一个 leaving)。
    // .on 在 current 与 leaving 期间都保留:入场动画全部挂 .slide.on 下,选择器在离场时不变,
    // 动画不被重置、以当前帧继续播并随整页淡出——修"翻页时动画瞬间跳完成态再过渡"的闪动。
    if (leavingEl) { leavingEl.classList.remove('leaving'); leavingEl.classList.remove('on'); leavingEl = null; }
    clearTimeout(leaveTimer);
    var old = slides[cur];
    slides[cur].classList.remove('current');
    if (old !== slides[i]) {
      old.classList.add('leaving');
      leavingEl = old;
      leaveTimer = setTimeout(function () { old.classList.remove('leaving'); old.classList.remove('on'); if (leavingEl === old) leavingEl = null; }, 460);
    }
    cur = i;
    slides[cur].classList.add('current');
    slides[cur].classList.add('on');
    if (stepsOf(cur)) setStep(cur, initStepOf(cur));
    rollNum(pnCur, String(cur + 1), dirn);
    pageTitle.textContent = slides[cur].dataset.title || '';
    // 标题超出固定槽位就缩字号(下限 10px),槽位宽度不动、时间轴起点才稳
    pageTitle.style.fontSize = '';
    for (var fs = 15; fs > 11 && pageTitle.scrollWidth > pageTitle.clientWidth; fs -= 0.5) {
      pageTitle.style.fontSize = fs + 'px';
    }
    // 画布带 nav-narrow 类的页:翻页热区收窄到 4%,给页内悬停交互让位
    document.body.classList.toggle('navnarrow', !!slides[cur].querySelector('.canvas.nav-narrow'));
    progressBar.style.width = ((cur + 1) / total * 100) + '%';
    loadNotes(cur);
    location.hash = 'p' + (cur + 1);
    // 声明 data-autostep(毫秒)的页:进页后延迟自动步进一步,不需手动 →
    var ac = slides[cur].querySelector('.canvas[data-autostep]');
    if (ac) {
      var target = cur;
      autoTimer = setTimeout(function () {
        if (cur === target && stepOf(cur) < stepsOf(cur)) setStep(cur, stepOf(cur) + 1);
      }, parseInt(ac.dataset.autostep, 10));
    }
    prFlip();
  }
  function next() {
    if (stepOf(cur) < stepsOf(cur)) setStep(cur, stepOf(cur) + 1);
    else go(cur + 1);
  }
  function prev() {
    // 只有声明了 data-steps 的页才回退步进;回退下限是 data-initstep(默认 0),静态硬编码 data-step 的页直接翻页
    if (stepsOf(cur) && stepOf(cur) > initStepOf(cur)) setStep(cur, stepOf(cur) - 1);
    else go(cur - 1);
  }

  // ===== 总览 =====
  function buildOverview() {
    ovGrid.innerHTML = '';
    slides.forEach(function (s, i) {
      var item = document.createElement('div');
      item.className = 'ovItem' + (i === cur ? ' now' : '');
      var wrap = document.createElement('div');
      wrap.className = 'thumbWrap';
      var clone = s.querySelector('.canvas').cloneNode(true);
      clone.style.transform = '';
      wrap.appendChild(clone);
      var cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = 'P' + (i + 1) + ' ' + (s.dataset.title || '');
      item.appendChild(wrap);
      item.appendChild(cap);
      item.addEventListener('click', function () {
        overview.classList.remove('open');
        go(i);
      });
      ovGrid.appendChild(item);
    });
    requestAnimationFrame(function () {
      var w = ovGrid.querySelector('.thumbWrap').getBoundingClientRect().width;
      ovGrid.style.setProperty('--ovscale', w / 1920);
      ovGrid.querySelectorAll('.thumbWrap').forEach(function (tw) {
        tw.style.setProperty('--ovscale', tw.getBoundingClientRect().width / 1920);
      });
    });
  }

  // ===== 讲稿与备注导出 =====
  // 导出取纯文本必须走这里:游离元素的 innerText 不做排版、段落间不产生换行,
  // 直接 innerText 会把整页讲稿黏成一坨(真发生过)。按 <p> 逐段取、段间空行。
  function textOf(html, ed) {
    normBox.innerHTML = ed ? ed.canon(html) : canon(html);
    var tmp = document.createElement('div'), out = [];
    Array.prototype.forEach.call(normBox.querySelectorAll('p'), function (p) {
      tmp.innerHTML = p.innerHTML.replace(/<br\s*\/?>/gi, '\n');
      var t = tmp.textContent.trim();
      if (t) out.push(t);
    });
    return out.join('\n\n');
  }
  function exportChangedNotes() {
    saveNote();
    var lines = ['# ' + DECK.name + ' | Changed notes', ''];
    var count = 0;
    slides.forEach(function (s, i) {
      var raw = localStorage.getItem(EDS[1].key + (i + 1));
      if (!raw) return;
      var txt = textOf(raw, EDS[1]);
      if (!txt) return;
      count++;
      lines.push('## P' + (i + 1) + ' ' + (s.dataset.title || ''), '', txt, '');
    });
    if (!count) { alert('No notes have been changed yet.'); return; }
    copyOut(lines.join('\n'), 'Copied changed notes from ' + count + ' page(s).');
  }

  // ===== 导出菜单:批注走剪贴板;图片/PDF 让本地提词服务代跑导出脚本(后台跑,完成弹系统通知) =====
  var exMenu = document.getElementById('exMenu');
  var exWrap = document.getElementById('exWrap');
  // 开合同时挂到 #exWrap:小三角靠它翻转
  function setExMenu(on) {
    exMenu.classList.toggle('open', on);
    exWrap.classList.toggle('open', on);
  }
  function doExport(kind) {
    setExMenu(false);
    if (kind === 'diff-notes') exportChangedNotes();
    else if (kind === 'script') exportScript();
    else exportServer(kind);
  }
  function exportScript() {
    saveNote();
    var lines = ['# ' + DECK.name + ' | Speaker script', ''];
    slides.forEach(function (s, i) {
      lines.push('## P' + (i + 1) + ' ' + (s.dataset.title || ''), '');
      var txt = textOf(localStorage.getItem(EDS[0].key + (i + 1)) || seedOf(i, EDS[0]), EDS[0]);
      lines.push(txt || '(No script)', '');
    });
    var blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (DECK.name || 'deck') + '-speaker-script.md';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function copyOut(md, ok) {
    function fb() {
      var ta = document.createElement('textarea');
      ta.value = md; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); alert(ok); }
      catch (e) { prompt('Copy failed. Copy manually:', md); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(md).then(function () { alert(ok); }, fb);
    else fb();
  }
  function exportServer(kind) {
    fetch(api('/export'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ what: kind })
    }).then(function (r) {
      if (r.status === 403) { alert('Access token missing. Refresh the page, then try exporting again.'); return { skip: 1 }; }
      return r.json();
    }).then(function (d) {
      if (d.skip) return;
      if (d.busy) alert('An export is already running. Wait for its completion notification.');
      else if (d.ok) alert({
        pdf: 'PDF export started. Pages will be captured and combined; a system notification will appear when it is ready.',
        imgs: 'Page image export started. A system notification will appear and open the output folder when ready.',
        send: 'Standalone HTML export started. Assets will be inlined and private notes removed.'
      }[kind]);
      else alert('Export could not start. Check the local service log.');
    }).catch(function () {
      alert('The local service is offline. Start the launcher, then try again.');
    });
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#exWrap')) setExMenu(false);
  });

  // ===== 模式 =====
  // 视图三段互斥:演示 / 默认 / 总览。演示态 = 演示样式 + 浏览器全屏一体(P/F 同效);
  // 系统手势/Esc 退出全屏时由 fullscreenchange 同步回默认。
  var segView = document.getElementById('segView');
  var segThumb = segView.querySelector('.thumb');
  var view = 'default';
  function positionThumb() {
    var on = segView.querySelector('button.on');
    if (!on) return;
    segThumb.style.width = on.offsetWidth + 'px';
    segThumb.style.height = on.offsetHeight + 'px';
    segThumb.style.transform = 'translate(' + on.offsetLeft + 'px,' + on.offsetTop + 'px)';
    if (segThumb.classList.contains('noanim')) {
      // 首帧只定位不动画,之后切换才滑动
      requestAnimationFrame(function () { segThumb.classList.remove('noanim'); });
    }
  }
  function syncToolbar() {
    Array.prototype.forEach.call(segView.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.dataset.view === view);
    });
    positionThumb();
    var rawBtn = document.querySelector('#toolbar button[data-act="raw"]');
    if (rawBtn) rawBtn.classList.toggle('on', document.body.classList.contains('raw'));
    var drawerBtn = document.getElementById('btnDrawer');
    if (drawerBtn) {
      var drawerOpen = document.body.classList.contains('notes-drawer-open');
      drawerBtn.classList.toggle('on', drawerOpen);
      drawerBtn.dataset.tip = drawerOpen ? 'Close notes' : 'Open notes';
      drawerBtn.setAttribute('aria-label', drawerOpen ? 'Close notes' : 'Open notes');
    }
  }
  function setView(v) {
    view = v;
    var b = document.body;
    if (v === 'overview') { buildOverview(); overview.classList.add('open'); }
    else overview.classList.remove('open');
    b.classList.toggle('ov', v === 'overview');
    var wantP = (v === 'present');
    b.classList.toggle('present', wantP);
    if (wantP && !document.fullscreenElement) {
      var p = document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(function () {});
    } else if (!wantP && document.fullscreenElement) {
      document.exitFullscreen();
    }
    if (v !== 'default') b.classList.remove('raw'); // 1:1 只在默认视图下成立
    syncToolbar();
    fitSlide();
  }
  function togglePresent() { setView(view === 'present' ? 'default' : 'present'); }
  function toggleOverview() { setView(view === 'overview' ? 'default' : 'overview'); }
  // 1:1 原尺寸:摘掉画布缩放,供 Figma 之类的 DOM 抓取插件按真实 1920×1080 读取
  function setRaw(on) {
    if (on && view !== 'default') setView('default');
    document.body.classList.toggle('raw', on);
    syncToolbar();
    fitSlide();
  }
  function toggleRaw() { setRaw(!document.body.classList.contains('raw')); }
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement && view === 'present') setView('default');
  });
  var notesAnimT = null;
  function toggleNotes() {
    if (view !== 'default') return; // 总览/演示态批注面板不显示,快捷键同步失效
    document.body.classList.add('notes-anim');
    document.body.classList.toggle('notes-mini');
    localStorage.setItem(PANEL_KEY, document.body.classList.contains('notes-mini') ? '0' : '1');
    syncToolbar();
    fitSlide();
    clearTimeout(notesAnimT);
    notesAnimT = setTimeout(function () {
      document.body.classList.remove('notes-anim');
      fitSlide();
    }, 340);
  }
  function setDrawer(on) {
    document.body.classList.toggle('notes-drawer-open', on);
    localStorage.setItem(DRAWER_KEY, on ? '1' : '0');
    if (on && document.body.classList.contains('notes-mini')) {
      document.body.classList.remove('notes-mini');
      localStorage.setItem(PANEL_KEY, '1');
    }
    syncToolbar();
    fitSlide();
  }
  function toggleDrawer() {
    if (view !== 'default') setView('default');
    setDrawer(!document.body.classList.contains('notes-drawer-open'));
  }

  // 手机提词器：二维码只指向当前局域网里的本机服务；网络变化时自动轮询刷新。
  var pd = document.getElementById('prompterDialog');
  var pdQr = document.getElementById('pdQr');
  var pdUrl = document.getElementById('pdUrl');
  var pdStatus = document.getElementById('pdStatus');
  var pdTimer = null;
  function refreshPrompterInfo() {
    fetch(api('/info')).then(function (r) {
      if (r.status === 403) throw new Error('Access token missing');
      return r.json();
    }).then(function (d) {
      var url = d.preferred || (d.urls && d.urls[0]) || '';
      if (!url) throw new Error('No local network address available');
      if (pdUrl.textContent !== url) {
        pdUrl.textContent = url;
        // 二维码链接由服务端自己拼(含凭据),页面只给序号
        pdQr.innerHTML = '<img alt="Phone prompter QR code" src="' + api(d.qr || '/qr.svg?i=0') + '&v=' + Date.now() + '">';
      }
      pdStatus.textContent = d.clients > 0 ? d.clients + ' device(s) connected' : 'Service ready. Waiting for phone';
      pdStatus.classList.add('ok');
    }).catch(function (e) {
      var noToken = String(e.message).indexOf('token') >= 0;
      pdQr.innerHTML = '<span>' + (noToken ? 'Access token missing' : 'Local service offline') + '</span>';
      pdUrl.textContent = '';
      pdStatus.textContent = noToken
        ? 'This page opened before the local service. Refresh it and try again.'
        : 'Start the local launcher, then try again.';
      pdStatus.classList.remove('ok');
    });
  }
  function openPrompter() {
    if (SEND_VERSION) return;
    pd.classList.add('open');
    refreshPrompterInfo();
    clearInterval(pdTimer);
    pdTimer = setInterval(refreshPrompterInfo, 3000);
  }
  function closePrompter() {
    pd.classList.remove('open');
    clearInterval(pdTimer);
  }

  // ===== 解释浮层:悬停 0.2 秒后出现。单层 fixed 元素,不受面板 overflow:hidden 裁剪 =====
  var tipEl = document.createElement('div');
  tipEl.id = 'tip';
  document.body.appendChild(tipEl);
  var tipTarget = null, tipTimer = null;
  function tipHide() {
    clearTimeout(tipTimer);
    tipEl.classList.remove('on');
    tipTarget = null;
  }
  function tipShow(el) {
    tipEl.textContent = el.dataset.tip || el.dataset.tipNow;
    var r = el.getBoundingClientRect();
    var t = tipEl.getBoundingClientRect();   // visibility:hidden 仍有尺寸,可先量再摆
    var left, top;
    if (el.closest('#exMenu')) {             // 菜单项:提示放左侧,不压住下一项
      left = r.left - t.width - 10;
      top = r.top + r.height / 2 - t.height / 2;
    } else {
      left = r.left + r.width / 2 - t.width / 2;
      top = el.classList.contains('tip-up') || el.dataset.tipNow ? r.top - t.height - 8 : r.bottom + 8;
    }
    tipEl.style.left = Math.min(Math.max(left, 8), window.innerWidth - t.width - 8) + 'px';
    tipEl.style.top = Math.min(Math.max(top, 8), window.innerHeight - t.height - 8) + 'px';
    tipEl.classList.add('on');
  }
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest ? e.target.closest('[data-tip],[data-tip-now]') : null;
    if (el === tipTarget) return;
    tipHide();
    if (!el) return;
    tipTarget = el;
    var wait = el.dataset.tipNow ? 0 : 200;   // 状态灯类:悬停即刻给出原因
    tipTimer = setTimeout(function () { if (tipTarget === el) tipShow(el); }, wait);
  });
  document.addEventListener('mouseout', function (e) {
    var el = e.target.closest ? e.target.closest('[data-tip],[data-tip-now]') : null;
    if (el && el === tipTarget) tipHide();
  });
  document.addEventListener('click', tipHide, true);
  window.addEventListener('scroll', tipHide, true);

  // ===== 事件 =====
  document.getElementById('toolbar').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.ex) { doExport(b.dataset.ex); return; }
    if (b.dataset.view) { setView(b.dataset.view); return; }
    var act = b.dataset.act;
    if (act === 'prev') go(cur - 1);
    else if (act === 'next') go(cur + 1);
    else if (act === 'raw') { setExMenu(false); toggleRaw(); }
    else if (act === 'drawer') toggleDrawer();
    else if (act === 'prompter') openPrompter();
    else if (act === 'export') setExMenu(!exMenu.classList.contains('open'));
  });
  document.getElementById('notesToggle').addEventListener('click', toggleNotes);
  document.getElementById('btnDrawer').addEventListener('click', toggleDrawer);
  // ===== 备注抽屉宽度:拖左边缘调整,按 DECK.key 记住 =====
  (function () {
    var grip = document.getElementById('drawerGrip');
    var KEY = DECK.key + '.dw';
    function clampW(w) {
      var max = Math.max(280, window.innerWidth - 360);
      return Math.round(Math.min(Math.max(w, 240), max));
    }
    function applyW(w) { document.documentElement.style.setProperty('--dw', w + 'px'); }
    var saved = parseInt(localStorage.getItem(KEY), 10);
    applyW(clampW(saved || Math.min(620, Math.round(window.innerWidth * 0.38))));
    var curW = 0, raf = 0;
    function onMove(e) {
      curW = clampW(window.innerWidth - e.clientX);
      applyW(curW);
      if (!raf) raf = requestAnimationFrame(function () { raf = 0; fitSlide(); });
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      document.body.classList.remove('drawer-resizing');
      if (curW) localStorage.setItem(KEY, curW);
      fitSlide();
    }
    grip.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (grip.setPointerCapture) grip.setPointerCapture(e.pointerId);
      document.body.classList.add('drawer-resizing');
      curW = clampW(window.innerWidth - e.clientX);
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
    window.addEventListener('resize', function () {
      var now = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--dw'), 10);
      if (now) applyW(clampW(now));
    });
  })();
  document.getElementById('pdClose').addEventListener('click', closePrompter);
  pd.addEventListener('click', function (e) { if (e.target === pd) closePrompter(); });
  document.getElementById('zonePrev').addEventListener('click', prev);
  document.getElementById('zoneNext').addEventListener('click', next);

  var saveTimer = null;
  EDS.forEach(function (ed) {
    ed.el.addEventListener('input', function () {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { saveNote(); scheduleSeed(); }, 400);
    });
  });

  // 粘贴净化:外部软件复制来的内容只保留文字与加粗,白底/字色/字号/斜体等样式全部丢弃。
  // 列表层级不丢:HTML 嵌套列表按深度转成 Markdown 前缀("- "/"    - "),纯文本保留行首缩进,
  // 落进左栏后由 decorate 的 Markdown 解析吃掉(一级=要点、缩进=关键词)。
  function pasteClean(e) {
    e.preventDefault();
    var esc = function (s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
    var out = '';
    var htmlData = e.clipboardData && e.clipboardData.getData('text/html');
    if (htmlData) {
      var doc = new DOMParser().parseFromString(htmlData, 'text/html');
      var BLOCK = /^(P|DIV|LI|TR|H[1-6]|BLOCKQUOTE|PRE|UL|OL|TABLE|SECTION|ARTICLE|FIGURE)$/;
      var paras = [], cur = [];
      var flush = function () {
        var t = cur.join('');
        if (t.replace(/<\/?b>|&nbsp;|\s/g, '') !== '') paras.push('<p>' + t + '</p>');
        cur = [];
      };
      var walk = function (node, bold, listDepth) {
        if (node.nodeType === 3) {
          if (node.textContent) cur.push(bold ? '<b>' + esc(node.textContent) + '</b>' : esc(node.textContent));
          return;
        }
        if (node.nodeType !== 1 || node.tagName === 'STYLE' || node.tagName === 'SCRIPT') return;
        if (node.tagName === 'BR') { flush(); return; }
        var fw = node.style && node.style.fontWeight;
        var b = bold || node.tagName === 'B' || node.tagName === 'STRONG' ||
                fw === 'bold' || fw === 'bolder' || parseInt(fw, 10) >= 600;
        if (node.tagName === 'UL' || node.tagName === 'OL') listDepth++;
        var isBlock = BLOCK.test(node.tagName);
        if (isBlock) flush();
        if (node.tagName === 'LI') cur.push(esc(listDepth > 1 ? '    - ' : '- '));
        Array.prototype.forEach.call(node.childNodes, function (ch) { walk(ch, b, listDepth); });
        if (isBlock) flush();
      };
      walk(doc.body, false, 0);
      flush();
      out = paras.join('');
    } else {
      var txt = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
      out = txt.split(/\n/).map(function (l) { return l.replace(/\s+$/, ''); })
        .filter(function (l) { return l.trim(); })
        .map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('');
    }
    if (out) document.execCommand('insertHTML', false, out);
  }
  edScript.addEventListener('paste', pasteClean);
  edComm.addEventListener('paste', pasteClean);
  window.addEventListener('beforeunload', saveNote);

  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')) {
      if (document.querySelector('.cv-editing')) return;   // 画布就地编辑中:走浏览器原生撤销
      if (e.target === edComm || edComm.contains(e.target)) return; // 备注走原生撤销
      // 批注区撤销/重做:编辑中直接接管;焦点在外时,面板可见即生效
      if (e.target.isContentEditable ||
          (!document.body.classList.contains('present') && !document.body.classList.contains('notes-hidden'))) {
        e.preventDefault();
        if (e.shiftKey) histRedo(); else histUndo();
      }
      return;
    }
    if (e.target.isContentEditable) {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;   // Cmd+P/F/O/R 等交回浏览器,不误触发演示或 1:1
    switch (e.key) {
      case 'ArrowRight': case 'ArrowDown': case ' ': case 'PageDown':
        e.preventDefault(); next(); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
        e.preventDefault(); prev(); break;
      case 'Home': e.preventDefault(); go(0); break;
      case 'End': e.preventDefault(); go(total - 1); break;
      case 'f': case 'F': case 'p': case 'P': togglePresent(); break;
      case 'n': case 'N': toggleNotes(); break;
      case 'o': case 'O': toggleOverview(); break;
      case 'r': case 'R': toggleRaw(); break;
      case 'Escape':
        if (document.body.classList.contains('raw')) setRaw(false);
        else if (view !== 'default') setView('default');
        break;
    }
  });

  // 演示模式下鼠标移到顶部露出工具条
  document.addEventListener('mousemove', function (e) {
    if (!document.body.classList.contains('present')) return;
    document.body.classList.toggle('reveal-ui', e.clientY < 60);
  });

  window.addEventListener('resize', fitSlide);

  // ===== 批注面板拖动上缘调高(存 localStorage,画布随拖实时缩放) =====
  (function () {
    var grip = document.getElementById('nGrip');
    var KEY = DECK.key + '.nh';
    function clampH(h) { return Math.round(Math.min(Math.max(h, 100), Math.max(160, window.innerHeight - 380))); }
    function applyH(h) { document.documentElement.style.setProperty('--nh', h + 'px'); }
    var saved = parseInt(localStorage.getItem(KEY), 10);
    if (saved) { applyH(clampH(saved)); fitSlide(); }
    var startY = 0, startH = 0, curH = 0, raf = 0;
    function onMove(e) {
      curH = clampH(startH + (startY - e.clientY));
      applyH(curH);
      if (!raf) raf = requestAnimationFrame(function () { raf = 0; fitSlide(); });
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      localStorage.setItem(KEY, curH);
      fitSlide();
    }
    grip.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (grip.setPointerCapture) grip.setPointerCapture(e.pointerId);
      startY = e.clientY;
      startH = curH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nh'), 10) || 296;
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  })();

  // ===== 金句逐字渐显:把 .pend .line 的文本拆成 .ch 字符,进页时按 --i 依次浮现(<br> 原样保留) =====
  (function () {
    var line = stage.querySelector('.pend .line');
    if (!line) return;
    var n = 0;
    Array.prototype.slice.call(line.childNodes).forEach(function (node) {
      if (node.nodeType !== 3) return;
      var frag = document.createDocumentFragment();
      node.textContent.split('').forEach(function (ch) {
        var s = document.createElement('span');
        s.className = 'ch';
        s.style.setProperty('--i', n++);
        s.textContent = ch;
        frag.appendChild(s);
      });
      line.replaceChild(frag, node);
    });
  })();

  // ===== 手机提词同步:翻页/步进/改稿时把状态 POST 给本地服务(scripts/prompter_server.py),
  // 由它在当前局域网内转发给手机提词页；服务没开时静默忽略。
  // 自动化实例(export_pages/build_pdf/测试的 headless 浏览器,navigator.webdriver=true)不参与——
  // 否则导出脚本逐页截图会把演示者的手机一路拽着乱跳;测试需要联动时在 URL 加 ?pr=1 显式开启 =====
  var PR_ON = (!navigator.webdriver || /[?&]pr=1/.test(location.search)) && !SEND_VERSION;
  function prPost(path, data) {
    if (!PR_ON) return;
    try { fetch(api(path), { method: 'POST', body: JSON.stringify(data) }).catch(function () {}); } catch (e) {}
  }
  function prFlip() { prPost('/flip', { page: cur + 1, step: stepOf(cur), steps: stepsOf(cur) }); }
  function prNotes() {
    prPost('/notes', { total: total, pages: slides.map(function (s, i) {
      // 讲稿过 canonNs 再推:手机拿到的恒为行类型类格式(旧标记种子也被转掉)
      var html = canonNs(i === cur ? edScript.innerHTML : (localStorage.getItem(EDS[0].key + (i + 1)) || seedOf(i, EDS[0])));
      var comm = i === cur ? edComm.innerHTML : (localStorage.getItem(EDS[1].key + (i + 1)) || seedOf(i, EDS[1]));
      return { n: i + 1, title: s.dataset.title || '', html: html, comm: comm, sec: Math.round(estSec(html)) };
    }) });
  }
  var prTimer = null;
  edScript.addEventListener('input', function () { clearTimeout(prTimer); prTimer = setTimeout(prNotes, 1200); });
  edComm.addEventListener('input', function () { clearTimeout(prTimer); prTimer = setTimeout(prNotes, 1200); });
  // 手机遥控:监听本地服务的 cmd 事件(手机在同步态翻页/点总览时发来);EventSource 断线自动重连。
  // dir=方向步进,与键盘 → 同走 next()/prev()(页内动画先步进再翻页);page=总览直接跳页
  if (PR_ON) try {
    new EventSource(api('/events')).addEventListener('cmd', function (e) {
      var d = JSON.parse(e.data);
      if (d.dir) { if (d.dir > 0) next(); else prev(); return; }
      var n = (d.page | 0) - 1;
      if (n >= 0 && n < total && n !== cur) go(n);
    });
  } catch (e) {}

  // ===== 启动 =====
  if (SEND_VERSION) document.body.classList.add('send');
  var start = 0;
  var m = location.hash.match(/^#p(\d+)$/);
  if (m) start = Math.min(Math.max(parseInt(m[1], 10) - 1, 0), total - 1);
  go(start, true); // 与翻页同一入口:data-autostep 等进页行为在直开链接时同样生效
  syncToolbar();
  fitSlide();
  prNotes();
  refreshLed();
  seedNow();       // 上次没写成的改动(当时服务没开)进页即补写
})();
</script>
</body>
</html>
