name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser test dependency
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Run unit tests
        run: python3 -m unittest discover -s support/tests -v
